<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Nebula Station — 18-Hole Space Mini Golf</title>
<style>
  :root {
    --panel: rgba(8, 13, 28, 0.86);
    --panel-strong: rgba(5, 9, 20, 0.94);
    --border: rgba(56, 189, 248, 0.34);
    --text: #f8fafc;
    --muted: #94a3b8;
    --cyan: #38bdf8;
    --cyan-bright: #7dd3fc;
    --gold: #facc15;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #040611; color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #glCanvas { display: block; width: 100%; height: 100%; touch-action: none; }

  .brand-stack {
    position: fixed; top: 12px; left: 14px; z-index: 10;
    display: flex; flex-direction: column; gap: 7px; pointer-events: none;
  }
  .brand-row { display: flex; align-items: center; gap: 8px; pointer-events: auto; }
  .back-hub {
    text-decoration: none; background: var(--panel); border: 1px solid var(--border);
    color: var(--cyan-bright); font-size: 11px; font-weight: 800; padding: 5px 9px;
    border-radius: 9px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: 0.15s;
  }
  .back-hub:hover { background: rgba(56,189,248,0.24); color: #fff; }
  .brand-title {
    font-size: 19px; font-weight: 900; letter-spacing: 0.03em; color: #fff;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.75); line-height: 1.05;
  }
  .brand-sub {
    font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #fde047; font-weight: 800; margin-top: 2px;
  }

  .hole-card {
    pointer-events: auto; display: flex; align-items: center; gap: 8px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 13px; padding: 7px 10px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
  }
  .hole-badge {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    border: 1.5px solid var(--cyan); background: rgba(56, 189, 248, 0.16);
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 12.5px; color: var(--cyan-bright);
  }
  .hole-meta { display: flex; flex-direction: column; min-width: 132px; }
  .hole-select {
    background: rgba(255,255,255,0.09); border: 1px solid rgba(56,189,248,0.34);
    color: #fff; border-radius: 7px; padding: 3px 7px; font-size: 11.5px; font-weight: 700;
    cursor: pointer; outline: none; max-width: 172px;
  }
  .hole-select option { background: #0a1128; color: #f0f9ff; }
  .hole-sub { font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1; font-weight: 700; margin-top: 2px; }
  .nav-arrows { display: flex; gap: 4px; margin-left: 2px; }
  .mini-btn {
    background: rgba(255,255,255,0.09); border: 1px solid rgba(255,255,255,0.16);
    color: var(--text); border-radius: 7px; padding: 4px 7px; font-size: 10.5px; font-weight: 800;
    cursor: pointer; transition: 0.15s;
  }
  .mini-btn:hover { background: rgba(56,189,248,0.32); color: #fff; }

  .top-right {
    position: fixed; top: 12px; right: 14px; z-index: 10;
    display: flex; flex-direction: column; align-items: flex-end;
  }
  .score-pill {
    display: flex; align-items: center; gap: 14px;
    background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border); border-radius: 13px; padding: 7px 14px;
    box-shadow: 0 10px 28px rgba(0,0,0,0.55);
  }
  .stat { display: flex; flex-direction: column; align-items: center; }
  .stat-lbl { font-size: 9px; letter-spacing: 0.11em; text-transform: uppercase; color: #cbd5e1; font-weight: 700; }
  .stat-val { font-size: 18px; font-weight: 900; color: #fff; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat-val.cyan { color: var(--cyan-bright); }
  .div { width: 1px; height: 22px; background: rgba(255,255,255,0.18); }

  .cam-rail {
    position: fixed; right: 14px; top: 50%; transform: translateY(-50%); z-index: 10;
    display: flex; flex-direction: column; gap: 6px;
  }
  .cam-btn {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: 7px 9px; font-size: 11px; font-weight: 700; cursor: pointer; text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.45); transition: 0.15s;
  }
  .cam-btn:hover { background: rgba(22, 44, 82, 0.95); }

  .bottom-dock {
    position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 10;
    display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 96vw;
  }
  .dock-tabs { display: flex; gap: 5px; flex-wrap: wrap; justify-content: center; }
  .dock-tab {
    background: var(--panel); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--border); color: var(--text); border-radius: 9px;
    padding: 5px 11px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.15s;
    box-shadow: 0 6px 18px rgba(0,0,0,0.4);
  }
  .dock-tab:hover { background: rgba(22, 44, 82, 0.95); }
  .dock-tab.on { border-color: var(--cyan); color: var(--cyan-bright); }

  .putt-console {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: center;
    background: var(--panel-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 15px; padding: 9px 15px;
    box-shadow: 0 14px 36px rgba(0,0,0,0.6);
  }
  .slider-grp { display: flex; flex-direction: column; gap: 4px; width: 142px; }
  .slider-head { display: flex; justify-content: space-between; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: #cbd5e1; font-weight: 700; }
  .slider-head span.val { color: #fde047; font-variant-numeric: tabular-nums; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 5px; border-radius: 99px;
    background: rgba(56, 189, 248, 0.3); outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
    background: #fde047; border: 2px solid #04121e; box-shadow: 0 0 8px rgba(250,204,21,0.85);
  }
  .putt-btn {
    background: linear-gradient(135deg, #0ea5e9, #6366f1); color: #fff;
    border: none; border-radius: 11px; padding: 10px 22px;
    font-size: 13.5px; font-weight: 900; letter-spacing: 0.05em; text-transform: uppercase; cursor: pointer;
    box-shadow: 0 6px 20px rgba(14, 165, 233, 0.45); transition: 0.15s;
  }
  .putt-btn:hover { filter: brightness(1.12); transform: translateY(-1px); }
  .dock-hint { font-size: 10px; color: #94a3b8; }

  #banner {
    position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
    background: rgba(6, 12, 28, 0.94); backdrop-filter: blur(16px);
    border: 2px solid var(--cyan); border-radius: 20px; padding: 20px 38px; text-align: center;
    z-index: 25; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    box-shadow: 0 0 48px rgba(56,189,248,0.45);
  }
  #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #bannerTitle { font-size: 32px; font-weight: 900; color: #fde047; letter-spacing: 0.04em; }
  #bannerSub { font-size: 14px; color: #e2e8f0; margin-top: 4px; font-weight: 600; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(4,9,22,0.84); backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 40; padding: 18px;
  }
  .modal-bg.open { display: flex; }
  .modal {
    background: #0b1530; border: 1px solid var(--border); border-radius: 20px;
    max-width: 780px; width: 100%; padding: 24px; box-shadow: 0 25px 70px rgba(0,0,0,0.82);
  }
  table.sc { width: 100%; border-collapse: collapse; font-size: 14px; margin: 16px 0 20px; }
  table.sc th, table.sc td { padding: 8px 5px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.1); }
  table.sc th { color: #94a3b8; font-size: 11px; text-transform: uppercase; }
  .under { color: #34d399; font-weight: 800; }
  .even { color: #f8fafc; font-weight: 700; }
  .over { color: #facc15; font-weight: 700; }
  #loader {
    position: fixed; inset: 0; background: #040611; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100; gap: 10px; transition: opacity 0.4s;
  }
  @media (max-width: 720px) {
    .slider-grp { width: 106px; }
    .cam-rail { display: none; }
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="loader">
  <div style="font-size:28px; font-weight:900; color:#7dd3fc; letter-spacing:0.08em;">NEBULA STATION</div>
  <div style="font-size:11px; letter-spacing:0.25em; text-transform:uppercase; color:#94a3b8;">LOADING 18-HOLE ORBITAL COURSE...</div>
</div>

<canvas id="glCanvas"></canvas>

<div class="brand-stack">
  <div class="brand-row">
    <a href="../index.html" class="back-hub">◀ Courses</a>
    <div>
      <div class="brand-title">Nebula Station</div>
      <div class="brand-sub">Orbital Championship 3D</div>
    </div>
  </div>
  <div class="hole-card">
    <div class="hole-badge" id="holeNumBadge">01</div>
    <div class="hole-meta">
      <select id="holeSelect" class="hole-select" title="Jump to any of the 18 holes"></select>
      <div class="hole-sub" id="holeSub">HOLE 1 OF 18 • PAR 2</div>
    </div>
    <div class="nav-arrows">
      <button class="mini-btn" id="btnPrevHole" title="Previous Hole">◀</button>
      <button class="mini-btn" id="btnNextHole" title="Next Hole">▶</button>
    </div>
  </div>
</div>

<div class="top-right">
  <div class="score-pill">
    <div class="stat"><span class="stat-lbl">Strokes</span><span class="stat-val" id="hudStrokes">0</span></div>
    <div class="div"></div>
    <div class="stat"><span class="stat-lbl">Card</span><span class="stat-val cyan" id="hudTotal">E</span></div>
  </div>
</div>

<div class="cam-rail">
  <button class="cam-btn" id="btnZoomIn" title="Zoom In">＋</button>
  <button class="cam-btn" id="btnZoomOut" title="Zoom Out">－</button>
  <button class="cam-btn" id="btnRotate" title="Rotate 45°">Rotate</button>
</div>

<div class="bottom-dock">
  <div class="dock-tabs">
    <button class="dock-tab" id="btnCam">Course view</button>
    <button class="dock-tab on" id="btnGuide">Guide: ON</button>
    <button class="dock-tab" id="btnScore">Scorecard</button>
    <button class="dock-tab" id="btnReset">Reset Ball</button>
    <button class="dock-tab on" id="btnSound">Sound: ON</button>
  </div>
  <div class="putt-console">
    <div class="slider-grp">
      <div class="slider-head"><span>AIM</span><span class="val" id="lblAim">0°</span></div>
      <input type="range" id="rngAim" min="-180" max="180" value="0" step="1">
    </div>
    <div class="slider-grp">
      <div class="slider-head"><span>POWER</span><span class="val" id="lblPower">45%</span></div>
      <input type="range" id="rngPower" min="5" max="100" value="45" step="1">
    </div>
    <button class="putt-btn" id="btnPutt">Launch</button>
  </div>
  <div class="dock-hint">Use sliders + Launch, or drag directly back from the ball • Drag sky to orbit</div>
</div>

<div id="banner">
  <div id="bannerTitle">SUPERNOVA!</div>
  <div id="bannerSub">2 Strokes on Par 3</div>
</div>

<div class="modal-bg" id="scoreModal">
  <div class="modal">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 id="modalHead" style="font-size:21px; font-weight:800; color:#7dd3fc;">Nebula Station — 18-Hole Scorecard</h2>
      <button class="dock-tab" id="btnCloseModal">Close</button>
    </div>
    <div style="overflow-x:auto;"><table class="sc" id="scoreTbl"></table></div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <div id="scoreSummary" style="font-weight:700; color:#cbd5e1;"></div>
      <button class="putt-btn" id="btnNewRound" style="padding:9px 18px; font-size:13px;">Play Again</button>
    </div>
  </div>
</div>

<script>
(() => {
  // =========================================================================
  // 0. PROCEDURAL NOISE & NORMAL MAP ENGINE
  // =========================================================================
  function hash2(x, y) {
    const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
    return h - Math.floor(h);
  }
  function noise2(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = hash2(ix, iy), b = hash2(ix + 1, iy);
    const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, octaves = 5) {
    let v = 0, amp = 0.5, freq = 1.0;
    for (let i = 0; i < octaves; i++) {
      v += amp * noise2(x * freq, y * freq);
      freq *= 2.04; amp *= 0.5;
    }
    return v;
  }
  function heightCanvasToNormalTexture(heightCanvas, strength = 2.0) {
    const w = heightCanvas.width, h = heightCanvas.height;
    const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
    const outC = document.createElement('canvas'); outC.width = w; outC.height = h;
    const outCtx = outC.getContext('2d');
    const dst = outCtx.createImageData(w, h);
    const d = dst.data;
    const getH = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255.0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const tl = getH(x - 1, y - 1), l = getH(x - 1, y), bl = getH(x - 1, y + 1);
        const t  = getH(x, y - 1),                         b  = getH(x, y + 1);
        const tr = getH(x + 1, y - 1), r = getH(x + 1, y), br = getH(x + 1, y + 1);
        const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
        const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
        let nx = -dx * strength, ny = -dy * strength, nz = 1.0;
        const len = Math.hypot(nx, ny, nz) || 1;
        nx /= len; ny /= len; nz /= len;
        const idx = (y * w + x) * 4;
        d[idx] = Math.round((nx * 0.5 + 0.5) * 255);
        d[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
        d[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
        d[idx + 3] = 255;
      }
    }
    outCtx.putImageData(dst, 0, 0);
    const tex = new THREE.CanvasTexture(outC);
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 8;
    return tex;
  }

  // =========================================================================
  // 1. VIVID DEEP-SPACE COSMIC NEBULA SKYDOME + GOLF COURSE PBR TEXTURES
  // =========================================================================
  function createCosmicNebulaSkyTexture() {
    const w = 1536, h = 768;
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d');

    // Deep obsidian-navy cosmos backdrop
    const bg = ctx.createLinearGradient(0, 0, 0, h);
    bg.addColorStop(0.0, '#040614');
    bg.addColorStop(0.5, '#0b0f2b');
    bg.addColorStop(1.0, '#040614');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);

    // Rich, saturated multi-color nebula ribbons (fiery orange-gold, violet-magenta, electric blue)
    ctx.globalCompositeOperation = 'screen';
    const bands = [
      // Fiery Orange & Amber Core Ribbon
      { x: 0.24, y: 0.34, rx: 240, ry: 130, rot: -0.35, col: 'rgba(249, 115, 22, 0.52)' },
      { x: 0.29, y: 0.38, rx: 170, ry: 95,  rot: -0.30, col: 'rgba(251, 191, 36, 0.45)' },
      { x: 0.78, y: 0.32, rx: 220, ry: 120, rot: -0.32, col: 'rgba(234, 88, 12, 0.46)' },
      // Deep Violet & Magenta Nebula Clouds
      { x: 0.42, y: 0.30, rx: 290, ry: 165, rot: -0.25, col: 'rgba(168, 85, 247, 0.52)' },
      { x: 0.52, y: 0.42, rx: 260, ry: 150, rot: -0.20, col: 'rgba(217, 70, 239, 0.44)' },
      { x: 0.14, y: 0.48, rx: 250, ry: 145, rot: -0.28, col: 'rgba(147, 51, 234, 0.46)' },
      { x: 0.88, y: 0.46, rx: 260, ry: 150, rot: -0.28, col: 'rgba(168, 85, 247, 0.48)' },
      // Electric Cosmic Cyan & Sapphire Wisps
      { x: 0.66, y: 0.36, rx: 270, ry: 155, rot: -0.22, col: 'rgba(14, 165, 233, 0.50)' },
      { x: 0.72, y: 0.48, rx: 220, ry: 130, rot: -0.18, col: 'rgba(56, 189, 248, 0.42)' },
      { x: 0.36, y: 0.55, rx: 240, ry: 130, rot: -0.24, col: 'rgba(37, 99, 235, 0.44)' },
      { x: 0.58, y: 0.60, rx: 230, ry: 120, rot: -0.20, col: 'rgba(14, 165, 233, 0.38)' }
    ];

    bands.forEach((b, idx) => {
      for (let k = 0; k < 5; k++) {
        const ox = ((b.x * w + (k - 2) * 52) + w) % w;
        const oy = b.y * h + Math.sin(idx * 1.7 + k) * 26;
        ctx.save();
        ctx.translate(ox, oy);
        ctx.rotate(b.rot);
        ctx.scale(1.0, b.ry / b.rx);
        const rad = b.rx * (0.68 + (k % 3) * 0.18);
        const rg = ctx.createRadialGradient(0, 0, 8, 0, 0, rad);
        rg.addColorStop(0.0, b.col);
        rg.addColorStop(0.55, b.col.slice(0, b.col.lastIndexOf(',')) + ', 0.20)');
        rg.addColorStop(1.0, 'rgba(0,0,0,0)');
        ctx.fillStyle = rg;
        ctx.beginPath(); ctx.arc(0, 0, rad, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      }
    });

    // Bright Starburst Core
    const coreG = ctx.createRadialGradient(w * 0.48, h * 0.32, 3, w * 0.48, h * 0.32, 130);
    coreG.addColorStop(0.0, 'rgba(255, 255, 255, 0.96)');
    coreG.addColorStop(0.22, 'rgba(253, 224, 71, 0.50)');
    coreG.addColorStop(0.55, 'rgba(192, 132, 252, 0.20)');
    coreG.addColorStop(1.0, 'rgba(0,0,0,0)');
    ctx.fillStyle = coreG;
    ctx.beginPath(); ctx.arc(w * 0.48, h * 0.32, 130, 0, Math.PI * 2); ctx.fill();

    // Crisp Starfield + 4-Point Sparkling Stars
    ctx.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 3400; i++) {
      const sx = hash2(i * 1.3, 4.7) * w;
      const sy = hash2(9.1, i * 2.1) * h;
      const sz = hash2(i, i) > 0.93 ? 2.2 : (hash2(i, 3.3) > 0.72 ? 1.5 : 1.0);
      const tint = i % 5 === 0 ? '#bae6fd' : (i % 7 === 0 ? '#fef08a' : (i % 9 === 0 ? '#f5d0fe' : '#ffffff'));
      ctx.fillStyle = tint;
      ctx.fillRect(sx, sy, sz, sz);
    }
    for (let i = 0; i < 55; i++) {
      const sx = hash2(i * 7.7, 13.1) * w;
      const sy = hash2(3.9, i * 5.3) * h * 0.85;
      const len = 6 + (i % 4) * 4;
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
      ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(sx - len, sy); ctx.lineTo(sx + len, sy); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx, sy - len); ctx.lineTo(sx, sy + len); ctx.stroke();
      ctx.fillStyle = '#fef9c3';
      ctx.beginPath(); ctx.arc(sx, sy, 2.0, 0, Math.PI * 2); ctx.fill();
    }

    return new THREE.CanvasTexture(c);
  }

  // Lush, Natural Golf-Course Emerald Turf with Crisp Mowing Stripes
  function createEmeraldTurfPBR() {
    const size = 512;
    const c = document.createElement('canvas'); c.width = c.height = size;
    const ctx = c.getContext('2d');
    const hC = document.createElement('canvas'); hC.width = hC.height = size;
    const hctx = hC.getContext('2d');

    ctx.fillStyle = '#16803c'; ctx.fillRect(0, 0, size, size);
    hctx.fillStyle = '#757575'; hctx.fillRect(0, 0, size, size);

    // Classic PGA-style emerald fairway mowing stripes
    for (let x = 0; x < size; x += 64) {
      ctx.fillStyle = (x / 64) % 2 === 0 ? '#1ea34a' : '#136c33';
      ctx.fillRect(x, 0, 64, size);
    }
    // Fine organic turf blades & micro-texture
    for (let i = 0; i < 26000; i++) {
      const x = Math.random() * size, y = Math.random() * size, t = Math.random();
      ctx.fillStyle = t > 0.65 ? 'rgba(134, 239, 172, 0.22)' : 'rgba(5, 46, 22, 0.26)';
      ctx.fillRect(x, y, 1.5, 2.5);
      const bv = Math.floor(85 + t * 140);

  function createRoundedPolygon(verts, arcSteps = 8) {
    const pts = [], n = verts.length;
    for (let i = 0; i < n; i++) {
      const prev = verts[(i - 1 + n) % n], curr = verts[i], next = verts[(i + 1) % n], r = curr.r || 0;
      if (r <= 0.01) { pts.push({ x: curr.x, z: curr.z }); continue; }
      const v1x = prev.x - curr.x, v1z = prev.z - curr.z, v2x = next.x - curr.x, v2z = next.z - curr.z;
      const l1 = Math.hypot(v1x, v1z), l2 = Math.hypot(v2x, v2z);
      const u1x = v1x / l1, u1z = v1z / l1, u2x = v2x / l2, u2z = v2z / l2;
      const dot = Math.max(-0.999, Math.min(0.999, u1x * u2x + u1z * u2z));
      const halfAng = Math.acos(dot) / 2;
      const tanDist = Math.min(r / Math.tan(halfAng), l1 * 0.45, l2 * 0.45), effR = tanDist * Math.tan(halfAng);
      const pStart = { x: curr.x + u1x * tanDist, z: curr.z + u1z * tanDist };
      const pEnd   = { x: curr.x + u2x * tanDist, z: curr.z + u2z * tanDist };
      const bx = u1x + u2x, bz = u1z + u2z, bl = Math.hypot(bx, bz), cDist = effR / Math.sin(halfAng);
      const cx = curr.x + (bx / bl) * cDist, cz = curr.z + (bz / bl) * cDist;
      let a1 = Math.atan2(pStart.z - cz, pStart.x - cx), a2 = Math.atan2(pEnd.z - cz, pEnd.x - cx), diff = a2 - a1;
      while (diff > Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      for (let s = 0; s <= arcSteps; s++) {
        const a = a1 + diff * (s / arcSteps);
        pts.push({ x: cx + Math.cos(a) * effR, z: cz + Math.sin(a) * effR });
      }
    }
    return pts;
  }

    for (let i = 0; i <= samples; i++) {

    const endP = curve.getPoint(1), endTan = curve.getTangent(1), endBaseA = Math.atan2(endTan.x, -endTan.z);
    for (let s = 1; s < 12; s++) {
      const a = endBaseA - (s / 12) * Math.PI;
      pts.push({ x: endP.x + Math.cos(a) * halfW, z: endP.z + Math.sin(a) * halfW });
    }
    for (let i = samples; i >= 0; i--) pts.push(leftPts[i]);
    const startP = curve.getPoint(0), startTan = curve.getTangent(0), startBaseA = Math.atan2(-startTan.x, startTan.z);
    for (let s = 1; s < 12; s++) {
      const a = startBaseA - (s / 12) * Math.PI;

  function ensureOutwardWinding(pts, wantOutward = true) {
    let area = 0;
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += (a.x * b.z - b.x * a.z); }

    return pts;

  function buildCurvedRailMesh(loopPts, wallHeight = 0.84, wallThick = 0.50, isInnerIsland = false) {
    const n = loopPts.length;
    const profile = [
      [0.0, 0.0, 0.0], [0.0, wallHeight - 0.12, 0.42], [0.10, wallHeight, 0.52],
      [wallThick - 0.10, wallHeight, 0.70], [wallThick, wallHeight - 0.12, 0.80], [wallThick, 0.0, 1.0]
    ];
    const pLen = profile.length, positions = [], uvs = [], indices = [], normals = [];
    const dirSign = isInnerIsland ? -1 : 1;
    for (let i = 0; i < n; i++) {
      const pPrev = loopPts[(i - 1 + n) % n], pCurr = loopPts[i], pNext = loopPts[(i + 1) % n];
      const e1x = pCurr.x - pPrev.x, e1z = pCurr.z - pPrev.z, e2x = pNext.x - pCurr.x, e2z = pNext.z - pCurr.z;
      const l1 = Math.hypot(e1x, e1z) || 1, l2 = Math.hypot(e2x, e2z) || 1;
      const n1x = (e1z / l1) * dirSign, n1z = (-e1x / l1) * dirSign, n2x = (e2z / l2) * dirSign, n2z = (-e2x / l2) * dirSign;
      let mx = n1x + n2x, mz = n1z + n2z; const ml = Math.hypot(mx, mz) || 1; mx /= ml; mz /= ml;
      const miter = Math.min(1.6, 1.0 / Math.max(0.55, mx * n1x + mz * n1z));
      normals.push({ x: mx * miter, z: mz * miter });
    }
    let arcDist = 0;
    for (let i = 0; i <= n; i++) {
      const idx = i % n, pt = loopPts[idx], nm = normals[idx];
      if (i > 0) { const prev = loopPts[(i - 1) % n]; arcDist += Math.hypot(pt.x - prev.x, pt.z - prev.z); }
      for (let j = 0; j < pLen; j++) {
        positions.push(pt.x + nm.x * profile[j][0], profile[j][1], pt.z + nm.z * profile[j][0]);
        uvs.push(arcDist * 0.25, profile[j][2]);
      }
    }
    for (let i = 0; i < n; i++) {
      const rowA = i * pLen, rowB = (i + 1) * pLen;
      for (let j = 0; j < pLen - 1; j++) {
        const a = rowA + j, b = rowB + j, c = rowB + j + 1, d = rowA + j + 1;
        if (!isInnerIsland) indices.push(a, b, c, a, c, d);
        else indices.push(a, c, b, a, d, c);

    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices); geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, matWall);
    mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
  }

    const shape = new THREE.Shape();
    outerPts.forEach((p, i) => { if (i === 0) shape.moveTo(p.x, -p.z); else shape.lineTo(p.x, -p.z); });
    shape.closePath();
    if (islandPts) {

      islandPts.forEach((p, i) => { if (i === 0) holePath.moveTo(p.x, -p.z); else holePath.lineTo(p.x, -p.z); });
      holePath.closePath(); shape.holes.push(holePath);

    const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.24, bevelEnabled: false, curveSegments: 1 });
    const mesh = new THREE.Mesh(geo, matGrass);
    mesh.rotation.x = -Math.PI / 2; mesh.receiveShadow = true; return mesh;
  }

    let inside = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const xi = pts[i].x, zi = pts[i].z, xj = pts[j].x, zj = pts[j].z;
      if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / ((zj - zi) || 1e-9) + xi)) inside = !inside;
    }
    return inside;
  }
  function minDistToPoly(x, z, pts) {
    let minD = Infinity;
    for (let i = 0; i < pts.length; i++) {
      const a = pts[i], b = pts[(i + 1) % pts.length];
      const vx = b.x - a.x, vz = b.z - a.z, l2 = vx * vx + vz * vz || 1;
      const t = Math.max(0, Math.min(1, ((x - a.x) * vx + (z - a.z) * vz) / l2));
      const d = Math.hypot(x - (a.x + t * vx), z - (a.z + t * vz));
      if (d < minD) minD = d;
    }
    return minD;
  }

  function syncSlidersFromState() {

    while (deg < -180) deg += 360;

  const raycaster = new THREE.Raycaster(), pointerNDC = new THREE.Vector2();

  let dragMode = null, lastPointer = { x: 0, y: 0 };

  function getGroundHit(cx, cy) {
    pointerNDC.x = (cx / window.innerWidth) * 2 - 1;
    pointerNDC.y = -(cy / window.innerHeight) * 2 + 1;
    raycaster.setFromCamera(pointerNDC, camera);
    const hit = new THREE.Vector3(); raycaster.ray.intersectPlane(groundPlane, hit); return hit;

  canvas.addEventListener('pointerdown', e => {
    initAudio(); lastPointer = { x: e.clientX, y: e.clientY };
    const hit = getGroundHit(e.clientX, e.clientY);
    if (ballStopped() && hit && Math.hypot(hit.x - state.ball.x, hit.z - state.ball.z) < 2.1) {
      dragMode = 'aim'; state.aiming = true; canvas.setPointerCapture(e.pointerId); return;
    }
    dragMode = 'orbit'; canvas.setPointerCapture(e.pointerId);

  canvas.addEventListener('pointermove', e => {
    if (!dragMode) return;
    if (dragMode === 'orbit') {
      const dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
      lastPointer = { x: e.clientX, y: e.clientY };
      state.camYaw -= dx * 0.0065;
      state.camPitch = Math.max(0.16, Math.min(1.25, state.camPitch + dy * 0.0055));
    } else if (dragMode === 'aim') {
      const hit = getGroundHit(e.clientX, e.clientY);
      if (hit) {
        const dx = state.ball.x - hit.x, dz = state.ball.z - hit.z;
        state.aimPower = Math.max(0.05, Math.min(1, Math.hypot(dx, dz) / 4.2));
        state.aimAngle = Math.atan2(dx, dz);

  function collideWall2D(ball, x1, z1, x2, z2, rest = 0.85, silent = false) {
    const vx = x2 - x1, vz = z2 - z1, lenSq = vx * vx + vz * vz;
    if (lenSq === 0) return;
    const t = Math.max(0, Math.min(1, ((ball.x - x1) * vx + (ball.z - z1) * vz) / lenSq));
    const cx = x1 + t * vx, cz = z1 + t * vz;
    const dx = ball.x - cx, dz = ball.z - cz, dist = Math.hypot(dx, dz);
    if (dist < ballRadius && dist > 0.00001) {
      const nx = dx / dist, nz = dz / dist;
      ball.x += nx * (ballRadius - dist); ball.z += nz * (ballRadius - dist);
      const vn = ball.vx * nx + ball.vz * nz;
      if (vn < 0) {
        if (!silent) { sfxBounce(Math.abs(vn), false); if (Math.abs(vn) > 5) spawnFX(cx, 0.38, cz, 0x38bdf8, 5, 3.0); }
        ball.vx -= (1 + rest) * vn * nx; ball.vz -= (1 + rest) * vn * nz;
      }
    }
  }

  function collideCircle2D(ball, cx, cz, cr, rest = 1.12, extraKick = 3.0, silent = false) {
    const dx = ball.x - cx, dz = ball.z - cz, dist = Math.hypot(dx, dz), minD = ballRadius + cr;
    if (dist < minD && dist > 0.00001) {
      const nx = dx / dist, nz = dz / dist;
      ball.x = cx + nx * minD; ball.z = cz + nz * minD;
      const vn = ball.vx * nx + ball.vz * nz;
      if (vn < 0) {
        ball.vx -= (1 + rest) * vn * nx; ball.vz -= (1 + rest) * vn * nz;
        if (extraKick > 0) { ball.vx += nx * extraKick; ball.vz += nz * extraKick; }
        if (!silent) { sfxBounce(Math.max(Math.abs(vn), extraKick * 4), extraKick > 0); spawnFX(cx + nx * cr, 0.42, cz + nz * cr, 0xc084fc, 12, 4.4); }
      }
    }
  }

  function updateAimAndPutter() {
    const stopped = ballStopped();
    aimGroup.visible = stopped && state.guideOn;
    if (stopped && state.putterSwingT <= 0) {
      putterGroup.visible = true;
      const pullBack = 0.36 + (state.aiming ? state.aimPower * 1.1 : state.aimPower * 0.45);
      putterGroup.position.set(state.ball.x - Math.sin(state.aimAngle) * pullBack, 0.24, state.ball.z - Math.cos(state.aimAngle) * pullBack);
      putterGroup.rotation.y = state.aimAngle;
    } else if (state.putterSwingT <= 0) {
      putterGroup.visible = false;
    }

    if (!aimGroup.visible) return;
    const hole = HOLES[state.holeIdx];
    const col = state.aimPower < 0.45 ? 0x7dd3fc : (state.aimPower < 0.8 ? 0xfde047 : 0xf43f5e);
    const sim = {
      x: state.ball.x, z: state.ball.z,
      vx: Math.sin(state.aimAngle) * Math.max(4.5, state.aimPower * 21.0),
      vz: Math.cos(state.aimAngle) * Math.max(4.5, state.aimPower * 21.0)
    };
    const stepDt = 0.022;
    for (let i = 0; i < aimDots.length; i++) {
      for (let s = 0; s < 3; s++) {
        sim.x += sim.vx * (stepDt / 3); sim.z += sim.vz * (stepDt / 3);
        for (const seg of state.wallSegs) collideWall2D(sim, seg[0], seg[1], seg[2], seg[3], 0.85, true);
        for (const bmp of hole.bumpers) collideCircle2D(sim, bmp.x, bmp.z, bmp.r, 1.12, 3.0, true);
      }
      aimDots[i].position.set(sim.x, 0.34, sim.z); aimDots[i].material.color.setHex(col);
    }
  }

  function stepPhysics(dt) {
    const hole = HOLES[state.holeIdx], b = state.ball;
    if (state.bannerT > 0) { state.bannerT -= dt; if (state.bannerT <= 0) document.getElementById('banner').classList.remove('show'); }

    if (state.putterSwingT > 0) {
      state.putterSwingT -= dt;
      putterGroup.position.x += Math.sin(state.aimAngle) * dt * 6.5;
      putterGroup.position.z += Math.cos(state.aimAngle) * dt * 6.5;
      if (state.putterSwingT <= 0) putterGroup.visible = false;
    }

    for (let i = fxParticles.length - 1; i >= 0; i--) {
      const p = fxParticles[i];
      p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
      p.vy -= 11.0 * dt; p.life -= dt;
      p.mesh.scale.setScalar(Math.max(0.01, p.life));
      if (p.life <= 0) { scene.remove(p.mesh); fxParticles.splice(i, 1); }
    }

    if (b.inHole) {
      b.sinkT += dt; b.y = Math.max(-0.22, 0.24 + ballRadius - b.sinkT * 1.15);
      state.nextHoleT -= dt;
      if (state.nextHoleT <= 0) {
        if (state.holeIdx < HOLES.length - 1) buildHole(state.holeIdx + 1);
        else showScorecard(true);
      }
      return;
    }

    const tSec = performance.now() * 0.001;
    state.dynWindmills.forEach(wm => { wm.angle += wm.def.speed * dt; wm.rotor.rotation.z = wm.angle; });
    state.dynMovers.forEach(mv => {
      const d = mv.def;
      mv.x = d.cx + Math.sin(tSec * d.speed + d.phase) * d.ampX;
      mv.z = d.cz + Math.cos(tSec * d.speed + d.phase) * d.ampZ;
      mv.mesh.position.set(mv.x, 0.24, mv.z);
    });
    if (b.portalCD > 0) b.portalCD -= dt;

    const groundY = 0.24 + ballRadius, sub = 16, sdt = dt / sub;
    for (let s = 0; s < sub; s++) {
      const airborne = b.y > groundY + 0.05;
      if (airborne || b.vy > 0) {
        b.vy -= 21.0 * sdt; b.y += b.vy * sdt;
        if (b.y <= groundY) {
          b.y = groundY;
          if (Math.abs(b.vy) > 2.2) { sfxBounce(Math.abs(b.vy) * 1.4, false); spawnFX(b.x, 0.28, b.z, 0x38bdf8, 6, 2.8); b.vy = -b.vy * 0.36; }
          else b.vy = 0;
        }
      }

      let inSand = false;
      if (!airborne) {
        hole.slopes.forEach(sl => {
          if (b.x >= sl.x1 && b.x <= sl.x2 && b.z >= sl.z1 && b.z <= sl.z2) { b.vx += sl.fx * sdt; b.vz += sl.fz * sdt; }
        });
        hole.ramps.forEach(rp => {
          if (Math.abs(b.x - rp.x) <= rp.w * 0.5 && Math.abs(b.z - rp.z) <= rp.d * 0.5) {
            const fSpd = b.vx * rp.dirX + b.vz * rp.dirZ;
            if (fSpd > 2.4 && b.vy <= 0.1) {
              b.vy = rp.vy * Math.min(1.15, Math.max(0.65, fSpd / 11.0));
              b.vx += rp.dirX * rp.boost; b.vz += rp.dirZ * rp.boost; b.y = groundY + 0.08;
              sfxJump(); spawnFX(b.x, 0.35, b.z, 0x38bdf8, 12, 4.0);
            }
          }
        });
        hole.boosts.forEach(bp => {
          if (Math.abs(b.x - bp.x) <= bp.w * 0.5 && Math.abs(b.z - bp.z) <= bp.d * 0.5) {
            b.vx += bp.fx * sdt; b.vz += bp.fz * sdt;
            if (s === 0 && Math.random() < 0.35) { sfxBoost(); spawnFX(b.x, 0.3, b.z, 0xc084fc, 3, 2.6); }
          }
        });
        for (const bk of hole.bunkers) {
          const dx = (b.x - bk.x) / bk.rx, dz = (b.z - bk.z) / bk.rz;
          if (dx * dx + dz * dz <= 1.0) { inSand = true; break; }
        }
        for (const pt of hole.portals) {
          if (b.portalCD <= 0 && Math.hypot(b.x - pt.inX, b.z - pt.inZ) < 0.68) {
            const spd = Math.max(5.5, Math.hypot(b.vx, b.vz));
            b.x = pt.outX; b.z = pt.outZ; b.vx = Math.sin(pt.outAngle) * spd; b.vz = Math.cos(pt.outAngle) * spd;
            b.portalCD = 1.2; sfxPortal();
            spawnFX(pt.inX, 0.5, pt.inZ, 0x38bdf8, 14, 4.5); spawnFX(pt.outX, 0.5, pt.outZ, 0xfde047, 16, 4.8);
          }
        }
      }

      b.x += b.vx * sdt; b.z += b.vz * sdt;
      const baseFric = airborne ? 0.9985 : (inSand ? 0.935 : 0.988);
      const fric = Math.pow(baseFric, sdt * 60);
      b.vx *= fric; b.vz *= fric;

      for (const seg of state.wallSegs) collideWall2D(b, seg[0], seg[1], seg[2], seg[3], 0.85);
      for (const bmp of hole.bumpers) collideCircle2D(b, bmp.x, bmp.z, bmp.r, 1.12, 3.0);

      for (const wm of state.dynWindmills) {
        collideCircle2D(b, wm.def.x, wm.def.z, 0.85, 0.82, 0);
        const frontZ = wm.def.z + 0.78;
        if (Math.abs(b.z - frontZ) < 0.34 && b.y < 0.85) {
          for (let bi = 0; bi < 4; bi++) {
            const a = wm.angle + (bi * Math.PI) / 2;
            if (1.48 + Math.sin(a) * wm.def.bladeLen < 0.45) {
              const bxAtGround = wm.def.x + Math.cos(a) * 1.2;
              if (Math.abs(b.x - bxAtGround) < 0.55) {
                b.vz = Math.abs(b.vz) * 0.85 + 3.2; b.z = frontZ + 0.36;
                sfxBounce(10, true); spawnFX(b.x, 0.4, b.z, 0x38bdf8, 8, 3.5);
              }
            }
          }
        }
      }

      for (const mv of state.dynMovers) {
        const hw = mv.def.w / 2, hd = mv.def.d / 2;
        const xL = mv.x - hw, xR = mv.x + hw, zF = mv.z + hd, zB = mv.z - hd;
        collideWall2D(b, xL, zF, xR, zF, 0.85); collideWall2D(b, xR, zF, xR, zB, 0.85);
        collideWall2D(b, xR, zB, xL, zB, 0.85); collideWall2D(b, xL, zB, xL, zF, 0.85);
      }

      if (!airborne) {
        for (const vt of hole.voids) {
          if (Math.abs(b.x - vt.x) < vt.w * 0.48 && Math.abs(b.z - vt.z) < vt.d * 0.48) {
            sfxVoid(); spawnFX(b.x, 0.35, b.z, 0xc084fc, 22, 5.2);
            state.strokes++; updateHUD();
            const ban = document.getElementById('banner');
            document.getElementById('bannerTitle').textContent = 'VOID CHASM!';
            document.getElementById('bannerSub').textContent = '+1 Penalty Stroke';
            ban.classList.add('show'); state.bannerT = 1.3;
            b.x = b.lastSafeX; b.z = b.lastSafeZ; b.y = groundY; b.vx = 0; b.vy = 0; b.vz = 0; return;
          }
        }
      }

      if (!pointInPoly(b.x, b.z, hole.outer) && minDistToPoly(b.x, b.z, hole.outer) > 0.35) {
        b.x = b.lastSafeX; b.z = b.lastSafeZ; b.y = groundY; b.vx = 0; b.vy = 0; b.vz = 0; return;
      }

      const cDist = Math.hypot(b.x - hole.cup.x, b.z - hole.cup.z);
      if (!airborne && cDist < 0.37 && Math.hypot(b.vx, b.vz) < 13.5) {
        b.inHole = true; b.x = hole.cup.x; b.z = hole.cup.z; b.vx = 0; b.vz = 0;
        state.scores[state.holeIdx] = state.strokes; updateHUD(); sfxCup();
        spawnFX(hole.cup.x, 0.4, hole.cup.z, 0x38bdf8, 24, 6.2);
        spawnFX(hole.cup.x, 0.4, hole.cup.z, 0xfde047, 18, 5.4);
        const diff = state.strokes - hole.par;
        let title = 'PAR!';
        if (state.strokes === 1) title = 'SUPERNOVA ACE!!';
        else if (diff <= -2) title = 'EAGLE!';
        else if (diff === -1) title = 'BIRDIE!';
        else if (diff === 1) title = 'BOGEY';
        else if (diff >= 2) title = `+${diff}`;
        const ban = document.getElementById('banner');
        document.getElementById('bannerTitle').textContent = title;
        document.getElementById('bannerSub').textContent = `${state.strokes} Stroke${state.strokes === 1 ? '' : 's'} on Par ${hole.par}`;
        ban.classList.add('show'); state.bannerT = 2.0; state.nextHoleT = 2.1; return;
      }
    }

    const spd = Math.hypot(b.vx, b.vz);
    if (spd < 0.08) { b.vx = 0; b.vz = 0; }
    else ballMesh.rotateOnWorldAxis(new THREE.Vector3(b.vz, 0, -b.vx).normalize(), (spd * dt) / ballRadius);
  }

  // =========================================================================
  // 9. UI, 18-HOLE SCORECARD & MAIN LOOP
  // =========================================================================
  function updateHUD() {
    document.getElementById('hudStrokes').textContent = state.strokes;
    let diff = 0, cnt = 0;
    state.scores.forEach((s, i) => { if (s !== null) { diff += s - HOLES[i].par; cnt++; } });
    document.getElementById('hudTotal').textContent = cnt === 0 || diff === 0 ? 'E' : (diff > 0 ? `+${diff}` : `${diff}`);
  }

  function showScorecard(final = false) {
    function buildNineTable(start, end, label) {
      let hRow = `<tr><th>${label}</th>`, pRow = '<tr><td><b>Par</b></td>', sRow = '<tr><td><b>You</b></td>';
      let tPar = 0, tScr = 0, any = false;
      for (let i = start; i < end; i++) {
        const h = HOLES[i]; tPar += h.par;
        hRow += `<th>${i + 1}</th>`; pRow += `<td>${h.par}</td>`;
        const s = state.scores[i];
        if (s === null) sRow += '<td>-</td>';
        else { any = true; tScr += s; sRow += `<td class="${s < h.par ? 'under' : (s === h.par ? 'even' : 'over')}">${s}</td>`; }
      }
      hRow += '<th>TOT</th></tr>'; pRow += `<td><b>${tPar}</b></td></tr>`; sRow += `<td><b>${any ? tScr : '-'}</b></td></tr>`;
      return hRow + pRow + sRow;
    }
    document.getElementById('scoreTbl').innerHTML = buildNineTable(0, 9, 'OUT') + buildNineTable(9, 18, 'IN');
    document.getElementById('modalHead').textContent = final ? 'Orbital Championship Complete!' : 'Nebula Station — 18-Hole Scorecard';
    let tPar = 0, tScr = 0, played = 0;
    HOLES.forEach((h, i) => { if (state.scores[i] !== null) { tPar += h.par; tScr += state.scores[i]; played++; } });
    const d = tScr - tPar;
    document.getElementById('scoreSummary').textContent = played ? `Played ${played}/18 • Score: ${tScr} (${d === 0 ? 'Even Par' : (d > 0 ? '+' + d : d)})` : 'Play holes to record your 18-hole round';
    if (final && played === HOLES.length) {
      const prev = parseInt(localStorage.getItem('minigolf_best_nebula-station') || '999', 10);
      if (tScr < prev) localStorage.setItem('minigolf_best_nebula-station', String(tScr));
    }
    document.getElementById('scoreModal').classList.add('open');
  }

  document.getElementById('btnCam').addEventListener('click', e => {
    state.camMode = state.camMode === 'follow' ? 'overview' : 'follow';
    e.target.textContent = state.camMode === 'follow' ? 'Course view' : 'Follow ball';
    e.target.classList.toggle('on', state.camMode === 'overview');
  });
  document.getElementById('btnGuide').addEventListener('click', e => {
    state.guideOn = !state.guideOn;
    e.target.textContent = state.guideOn ? 'Guide: ON' : 'Guide: OFF';
    e.target.classList.toggle('on', state.guideOn);
  });
  document.getElementById('btnZoomIn').addEventListener('click', () => { state.camDist = Math.max(4.8, state.camDist - 1.8); });
  document.getElementById('btnZoomOut').addEventListener('click', () => { state.camDist = Math.min(23.0, state.camDist + 1.8); });
  document.getElementById('btnRotate').addEventListener('click', () => { state.camYaw += Math.PI / 4; });
  document.getElementById('btnPrevHole').addEventListener('click', () => buildHole((state.holeIdx - 1 + HOLES.length) % HOLES.length));
  document.getElementById('btnNextHole').addEventListener('click', () => buildHole((state.holeIdx + 1) % HOLES.length));
  document.getElementById('btnReset').addEventListener('click', () => buildHole(state.holeIdx));
  document.getElementById('btnScore').addEventListener('click', () => showScorecard(false));
  document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('scoreModal').classList.remove('open'));
  document.getElementById('btnNewRound').addEventListener('click', () => {
    state.scores = Array(HOLES.length).fill(null);
    document.getElementById('scoreModal').classList.remove('open');
    buildHole(0);
  });
  document.getElementById('btnSound').addEventListener('click', e => {
    soundOn = !soundOn; e.target.textContent = soundOn ? 'Sound: ON' : 'Sound: OFF';
    e.target.classList.toggle('on', soundOn);
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  let lastT = performance.now();
  function animate(now) {
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    stepPhysics(dt);
    updateAimAndPutter();

    voidUniforms.uTime.value = now * 0.001;
    skyDome.rotation.y += dt * 0.006;
    planetMesh.rotation.y += dt * 0.025;
    stationRing.rotation.z += dt * 0.14;
    asteroids.forEach(a => { a.mesh.rotation.x += a.rx * dt; a.mesh.rotation.y += a.ry * dt; });

    ballMesh.position.set(state.ball.x, state.ball.y, state.ball.z);
    ballShadowDisc.position.set(state.ball.x, 0.243, state.ball.z);
    const airH = Math.max(0, state.ball.y - (0.24 + ballRadius));
    ballShadowDisc.scale.setScalar(Math.max(0.45, 1.0 - airH * 0.18));
    ballShadowDisc.visible = !state.ball.inHole;

    const stopped = ballStopped();
    readyRing.visible = stopped;
    if (stopped) {
      readyRing.position.set(state.ball.x, 0.247, state.ball.z);
      readyRing.scale.setScalar(1 + Math.sin(now * 0.006) * 0.13);
    }

    if (state.flagMesh) {
      const fp = state.flagMesh.geometry.attributes.position;
      for (let i = 0; i < fp.count; i++) {
        const fx = fp.getX(i);
        fp.setZ(i, Math.sin(now * 0.008 - fx * 4.5) * 0.06 * (fx + 0.5));
      }
      fp.needsUpdate = true;
    }

    chevronTex.offset.y -= dt * 0.85;

    const dArr = dustGeo.attributes.position.array;
    for (let i = 0; i < dustCount; i++) {
      dArr[i * 3 + 1] += Math.sin(now * 0.001 + i) * 0.25 * dt;
    }
    dustGeo.attributes.position.needsUpdate = true;

    if (state.camMode === 'overview') {
      camera.position.lerp(new THREE.Vector3(0, 22, 24), 0.08);
      camera.lookAt(0, 1.5, -4);
    } else {
      const cx = state.ball.x + Math.sin(state.camYaw) * Math.cos(state.camPitch) * state.camDist;
      const cy = state.ball.y + Math.sin(state.camPitch) * state.camDist;
      const cz = state.ball.z + Math.cos(state.camYaw) * Math.cos(state.camPitch) * state.camDist;
      camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
      camera.lookAt(state.ball.x, state.ball.y + 0.55, state.ball.z);
    }

    sunLight.target.position.set(state.ball.x, 0, state.ball.z);
    sunLight.target.updateMatrixWorld();
    renderer.render(scene, camera);
    requestAnimationFrame(animate);
  }

  const holeSel = document.getElementById('holeSelect');
  HOLES.forEach((h, i) => {
    const opt = document.createElement('option');
    opt.value = String(i); opt.textContent = `${i + 1}. ${h.name}`;
    holeSel.appendChild(opt);
  });
  holeSel.addEventListener('change', () => buildHole(parseInt(holeSel.value, 10)));

  buildHole(0);
  setTimeout(() => {
    const ld = document.getElementById('loader');
    if (ld) { ld.style.opacity = '0'; setTimeout(() => ld.remove(), 400); }
  }, 220);
  requestAnimationFrame(animate);
})();
</script>
</body>
