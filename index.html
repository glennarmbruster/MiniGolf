<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Goobs MiniGolf — 3D Championship Hub</title>
<style>
  :root {
    --bg: #070c14;
    --card: rgba(15, 23, 38, 0.82);
    --border: rgba(255, 255, 255, 0.12);
    --text: #f8fafc;
    --muted: #94a3b8;
    --gold: #f5d89a;
    --cyan: #38bdf8;
    --emerald: #34d399;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100%; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
  }
  .bg-glow {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(circle at 18% 20%, rgba(16, 185, 129, 0.14), transparent 42%),
      radial-gradient(circle at 82% 24%, rgba(56, 189, 248, 0.16), transparent 44%),
      radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.14), transparent 48%);
  }
  .wrap {
    position: relative; z-index: 1; max-width: 1120px; margin: 0 auto;
    padding: 48px 22px 64px;
  }
  header { text-align: center; margin-bottom: 44px; }
  .eyebrow {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 0.24em;
    text-transform: uppercase; color: var(--gold);
    background: rgba(245, 216, 154, 0.1); border: 1px solid rgba(245, 216, 154, 0.25);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(32px, 5vw, 52px); font-weight: 700; letter-spacing: 0.01em;
    color: #fff; margin-bottom: 10px;
  }
  .subtitle {
    color: var(--muted); font-size: 16px; max-width: 600px; margin: 0 auto; line-height: 1.5;
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 24px;
  }
  .course-card {
    position: relative; display: flex; flex-direction: column;
    background: var(--card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--border); border-radius: 22px; overflow: hidden;
    text-decoration: none; color: inherit;
    box-shadow: 0 18px 46px rgba(0, 0, 0, 0.45);
    transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.22s, box-shadow 0.22s;
  }
  .course-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255, 255, 255, 0.32);
    box-shadow: 0 26px 64px rgba(0, 0, 0, 0.6);
  }
  .banner {
    height: 190px; position: relative; overflow: hidden;
    display: flex; align-items: flex-end; padding: 18px 20px;
  }
  .banner svg {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;
    opacity: 0.92; transition: transform 0.35s ease;
  }
  .course-card:hover .banner svg { transform: scale(1.05); }
  .banner-overlay {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(7,12,20,0.08) 0%, rgba(7,12,20,0.82) 100%);
  }
  .badge-row {
    position: relative; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap;
  }
  .badge {
    font-size: 10.5px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase;
    padding: 4px 10px; border-radius: 999px;
    background: rgba(7, 12, 20, 0.72); border: 1px solid rgba(255, 255, 255, 0.2);
    color: #fff;
  }
  .badge.best {
    background: rgba(16, 185, 129, 0.22); border-color: rgba(52, 211, 153, 0.5); color: #6ee7b7;
  }
  .card-body {
    padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 10px; flex: 1;
  }
  .card-title {
    font-family: Georgia, serif; font-size: 24px; font-weight: 700; color: #fff;
  }
  .card-tagline {
    font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--gold); margin-top: -4px;
  }
  .card-desc {
    font-size: 14px; color: #cbd5e1; line-height: 1.55; flex: 1;
  }
  .tags {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px;
  }
  .tag {
    font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.06);
    padding: 4px 9px; border-radius: 7px; font-weight: 600;
  }
  .play-cta {
    margin-top: 10px; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-radius: 13px; font-weight: 800; font-size: 14px;
    color: #091318; transition: filter 0.15s;
  }
  .course-card:hover .play-cta { filter: brightness(1.08); }

  footer {
    margin-top: 46px; text-align: center; color: var(--muted); font-size: 12.5px;
  }
  footer code {
    background: rgba(255,255,255,0.08); padding: 2px 7px; border-radius: 6px; color: #e2e8f0;
  }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">
  <header>
    <div class="eyebrow">3D WebGL Championship Collection</div>
    <h1>MiniGolf Resort Hub</h1>
    <p class="subtitle">Choose an 18-hole 3D course to tee off. Progress and personal best rounds are saved automatically in your browser.</p>
  </header>

  <div class="grid" id="courseGrid"></div>

  <footer>
    To add a future course, drop its folder into this repo and add one entry to the <code>COURSES</code> list in <code>index.html</code>.
  </footer>
</div>

<script>
  // =========================================================================
  // COURSE REGISTRY — Add future courses here as new entries!
  // =========================================================================
  const COURSES = [
    {
      id: "zen-dragon",
      title: "Zen Dragon Links",
      tagline: "The Jade Garden & Lighthouse Coast",
      holes: 18,
      par: 59,
      path: "./zen-dragon/index.html",
      accent: "linear-gradient(135deg, #f3d79b, #d8b16a)",
      description: "Putts wind through raked Zen sand, cherry blossom groves, a three-tier Jade Pagoda, rotating windmills, airborne water jumps, and a sweeping coastal lighthouse.",
      features: ["18 Holes", "Coastal Lighthouse", "3D Ramp Jumps", "Windmills & Portals", "Day / Dawn / Dusk / Night"],
      art: `<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="zg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#1e6091"/><stop offset="55%" stop-color="#89c2d9"/><stop offset="100%" stop-color="#e6ccb2"/>
          </linearGradient>
        </defs>
        <rect width="600" height="300" fill="url(#zg)"/>
        <path d="M0 190 Q110 115 230 165 T470 140 T600 175 L600 300 L0 300 Z" fill="#3a664b" opacity="0.72"/>
        <path d="M0 225 Q180 195 360 225 T600 215 L600 300 L0 300 Z" fill="#d8be96"/>
        <ellipse cx="300" cy="255" rx="220" ry="38" fill="#277d1c" stroke="#c8a87e" stroke-width="10"/>
        <g transform="translate(410, 88)">
          <polygon points="40,0 0,24 80,24" fill="#265452"/>
          <rect x="16" y="24" width="48" height="20" fill="#8f2424"/>
          <polygon points="40,36 -10,64 90,64" fill="#265452"/>
          <rect x="10" y="64" width="60" height="24" fill="#8f2424"/>
          <polygon points="40,78 -18,108 98,108" fill="#265452"/>
          <rect x="4" y="108" width="72" height="22" fill="#d4b58f"/>
        </g>
        <g transform="translate(105, 86)">
          <rect x="14" y="24" width="22" height="90" fill="#f8f5ee"/>
          <rect x="14" y="42" width="22" height="18" fill="#c22b2b"/>
          <rect x="14" y="76" width="22" height="18" fill="#c22b2b"/>
          <circle cx="25" cy="18" r="10" fill="#ffe082"/>
          <polygon points="25,2 10,16 40,16" fill="#c22b2b"/>
        </g>
        <circle cx="245" cy="250" r="10" fill="#facc15" stroke="#fff" stroke-width="2"/>
      </svg>`
    },
    {
      id: "nebula-station",
      title: "Nebula Station Links",
      tagline: "Orbital Deck & Deep Nebula",
      holes: 18,
      par: 60,
      path: "./nebula-station/index.html",
      accent: "linear-gradient(135deg, #38bdf8, #818cf8)",
      description: "Tee off aboard a suspended orbital station beneath a massive ringed gas giant, featuring plasma bumpers, rotating solar arrays, wormholes, hyper-ramps over void chasms, and meteor showers.",
      features: ["18 Holes", "Ringed Gas Giant", "Void Chasm Jumps", "Solar Windmills & Wormholes", "Meteor Shower Mode"],
      art: `<svg viewBox="0 0 600 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#070b1e"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0e3a5c"/>
          </linearGradient>
          <radialGradient id="pg" cx="35%" cy="35%" r="65%">
            <stop offset="0%" stop-color="#7dd3fc"/><stop offset="55%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#1e1b4b"/>
          </radialGradient>
        </defs>
        <rect width="600" height="300" fill="url(#sg)"/>
        <circle cx="80" cy="48" r="2" fill="#fff"/><circle cx="150" cy="30" r="1.5" fill="#bae6fd"/>
        <circle cx="240" cy="62" r="2" fill="#f5d0fe"/><circle cx="520" cy="44" r="2.2" fill="#fff"/>
        <circle cx="480" cy="95" r="1.6" fill="#7dd3fc"/><circle cx="62" cy="110" r="1.8" fill="#fff"/>
        <g transform="translate(415, 115) rotate(-16)">
          <ellipse cx="0" cy="0" rx="135" ry="28" fill="none" stroke="#38bdf8" stroke-width="10" opacity="0.35"/>
          <ellipse cx="0" cy="0" rx="112" ry="21" fill="none" stroke="#c084fc" stroke-width="6" opacity="0.45"/>
          <circle cx="0" cy="0" r="62" fill="url(#pg)"/>
          <path d="M-135,0 A135,28 0 0,0 135,0" fill="none" stroke="#7dd3fc" stroke-width="8" opacity="0.65"/>
        </g>
        <ellipse cx="290" cy="256" rx="225" ry="38" fill="#0f766e" stroke="#38bdf8" stroke-width="7"/>
        <ellipse cx="290" cy="256" rx="218" ry="32" fill="none" stroke="#5eead4" stroke-width="2" opacity="0.6"/>
        <circle cx="220" cy="250" r="10" fill="#fde047" stroke="#38bdf8" stroke-width="3"/>
      </svg>`
    }
  ];

  const grid = document.getElementById('courseGrid');
  COURSES.forEach(c => {
    const best = localStorage.getItem(`minigolf_best_${c.id}`);
    const bestHtml = best ? `<span class="badge best">Best: ${best}</span>` : '';
    const card = document.createElement('a');
    card.className = 'course-card';
    card.href = c.path;
    card.innerHTML = `
      <div class="banner">
        ${c.art}
        <div class="banner-overlay"></div>
        <div class="badge-row">
          <span class="badge">${c.holes} Holes • Par ${c.par}</span>
          ${bestHtml}
        </div>
      </div>
      <div class="card-body">
        <div class="card-title">${c.title}</div>
        <div class="card-tagline">${c.tagline}</div>
        <div class="card-desc">${c.description}</div>
        <div class="tags">${c.features.map(f => `<span class="tag">${f}</span>`).join('')}</div>
        <div class="play-cta" style="background:${c.accent};">
          <span>Play ${c.title}</span>
          <span>▶</span>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
</script>
</body>
</html>
