<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zen Dragon Links — 18-Hole Grand Championship 3D</title>
<style>
 :root {
 --panel: rgba(16, 30, 29, 0.84);
 --panel-strong: rgba(12, 24, 24, 0.92);
 --border: rgba(235, 215, 175, 0.22);
 --text: #f6f2e9;
 --muted: #b4c2bc;
 --gold: #e6c687;
 --gold-bright: #f5d89a;
 --accent: #34d399;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
 html, body {
 width: 100%; height: 100%; overflow: hidden;
 background: #101b1b; color: var(--text);
 font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
 }
 #glCanvas { display: block; width: 100%; height: 100%; touch-action: none; }
 #vignette {
 position: fixed; inset: 0; pointer-events: none; z-index: 4;
 background: radial-gradient(ellipse at center, rgba(0,0,0,0) 62%, rgba(8,14,14,0.34) 100%);
 }

 /* Brand & Top-Left Hole Card */
 .brand-stack {
 position: fixed; top: 14px; left: 18px; z-index: 10;
 display: flex; flex-direction: column; gap: 8px; pointer-events: none;
 }
 .brand-title {
 font-family: Georgia, "Times New Roman", serif;
 font-size: 22px; font-weight: 700; letter-spacing: 0.02em; color: #fffaf0;
 text-shadow: 0 2px 10px rgba(0,0,0,0.45); line-height: 1.05;
 }
 .brand-sub {
 font-size: 9.5px; letter-spacing: 0.24em; text-transform: uppercase;
 color: var(--gold); font-weight: 700; margin-top: 2px;
 text-shadow: 0 1px 6px rgba(0,0,0,0.5);
 }
 .hole-card {
 pointer-events: auto; display: flex; align-items: center; gap: 10px;
 background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
 border: 1px solid var(--border); border-radius: 14px; padding: 8px 12px;
 box-shadow: 0 10px 28px rgba(0,0,0,0.35);
 }
 .hole-badge {
 width: 34px; height: 34px; border-radius: 50%;
 border: 1.5px solid var(--gold); background: rgba(230, 198, 135, 0.12);
 display: flex; align-items: center; justify-content: center;
 font-weight: 800; font-size: 13px; color: var(--gold-bright);
 }
 .hole-meta { display: flex; flex-direction: column; min-width: 140px; }
 .hole-name { font-size: 13.5px; font-weight: 700; color: #fff; }
 .hole-sub { font-size: 10px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-top: 1px; }
 .nav-arrows { display: flex; gap: 4px; margin-left: 4px; }
 .hole-select {
 background: rgba(255,255,255,0.08); border: 1px solid rgba(235,215,175,0.22);
 color: #fff; border-radius: 8px; padding: 4px 8px; font-size: 12px; font-weight: 700;
 cursor: pointer; outline: none; max-width: 175px;
 }
 .hole-select option { background: #101f1f; color: #f6f2e9; }
 .mini-btn {
 background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
 color: var(--text); border-radius: 8px; padding: 5px 8px; font-size: 11px; font-weight: 800;
 cursor: pointer; transition: 0.15s;
 }
 .mini-btn:hover { background: rgba(230,198,135,0.22); color: #fff; }

 /* Top-Right Score & Atmosphere Controls */
 .top-right {
 position: fixed; top: 14px; right: 18px; z-index: 10;
 display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
 }
 .score-pill {
 display: flex; align-items: center; gap: 16px;
 background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
 border: 1px solid var(--border); border-radius: 14px; padding: 8px 16px;
 box-shadow: 0 10px 28px rgba(0,0,0,0.35);
 }
 .stat { display: flex; flex-direction: column; align-items: center; }
 .stat-lbl { font-size: 9.5px; letter-spacing: 0.11em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
 .stat-val { font-family: Georgia, serif; font-size: 20px; font-weight: 700; color: #fff; line-height: 1.1; }
 .stat-val.gold { color: var(--gold-bright); }

 .atm-box {
 background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
 border: 1px solid var(--border); border-radius: 12px; padding: 6px 9px;
 display: flex; flex-direction: column; gap: 4px; box-shadow: 0 10px 28px rgba(0,0,0,0.35);
 }
 .atm-row { display: flex; align-items: center; gap: 4px; }
 .atm-lbl { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; width: 38px; }
 .pill {
 background: rgba(255,255,255,0.07); border: 1px solid transparent; color: #cbd5e1;
 font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 7px; cursor: pointer; transition: 0.15s;
 }
 .pill:hover { background: rgba(255,255,255,0.16); color: #fff; }
 .pill.active { background: var(--gold); color: #162422; font-weight: 800; }

 /* Right-Side Camera Zoom/Rotate Controls */
 .cam-rail {
 position: fixed; right: 18px; top: 50%; transform: translateY(-50%); z-index: 10;
 display: flex; flex-direction: column; gap: 6px;
 }
 .cam-btn {
 background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--border);
 color: var(--text); border-radius: 10px; padding: 8px 10px; font-size: 12px; font-weight: 700;
 cursor: pointer; text-align: center; box-shadow: 0 8px 20px rgba(0,0,0,0.32); transition: 0.15s;
 }
 .cam-btn:hover { background: rgba(30, 52, 50, 0.95); }

 /* Bottom Luxury Putt Control Dock */
 .bottom-dock {
 position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10;
 display: flex; flex-direction: column; align-items: center; gap: 7px; max-width: 96vw;
 }
 .dock-tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
 .dock-tab {
 background: var(--panel); backdrop-filter: blur(12px); border: 1px solid var(--border);
 color: var(--text); border-radius: 10px; padding: 6px 12px; font-size: 11.5px; font-weight: 700;
 cursor: pointer; transition: 0.15s; box-shadow: 0 6px 18px rgba(0,0,0,0.3);
 }
 .dock-tab:hover { background: rgba(30, 54, 52, 0.95); }
 .dock-tab.on { border-color: var(--gold); color: var(--gold-bright); }

 .putt-console {
 display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: center;
 background: var(--panel-strong); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
 border: 1px solid var(--border); border-radius: 16px; padding: 10px 16px;
 box-shadow: 0 14px 36px rgba(0,0,0,0.45);
 }
 .slider-grp { display: flex; flex-direction: column; gap: 4px; width: 148px; }
 .slider-head { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
 .slider-head span.val { color: var(--gold-bright); font-variant-numeric: tabular-nums; }
 input[type=range] {
 -webkit-appearance: none; width: 100%; height: 5px; border-radius: 99px;
 background: rgba(230, 198, 135, 0.25); outline: none; cursor: pointer;
 }
 input[type=range]::-webkit-slider-thumb {
 -webkit-appearance: none; width: 15px; height: 15px; border-radius: 50%;
 background: var(--gold-bright); border: 2px solid #132220; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
 }
 .putt-btn {
 background: linear-gradient(180deg, #f3d79b, #d8b16a); color: #16221f;
 border: none; border-radius: 12px; padding: 11px 24px;
 font-family: Georgia, serif; font-size: 15px; font-weight: 800; cursor: pointer;
 box-shadow: 0 6px 18px rgba(216, 177, 106, 0.35); transition: 0.15s;
 }
 .putt-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
 .putt-btn:active { transform: translateY(0); }
 .dock-hint { font-size: 10.5px; color: var(--muted); letter-spacing: 0.02em; }

 #banner {
 position: fixed; top: 42%; left: 50%; transform: translate(-50%, -50%) scale(0.85);
 background: rgba(12, 24, 24, 0.94); backdrop-filter: blur(16px);
 border: 2px solid var(--gold); border-radius: 20px; padding: 20px 38px; text-align: center;
 z-index: 25; opacity: 0; pointer-events: none; transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
 box-shadow: 0 24px 64px rgba(0,0,0,0.75);
 }
 #banner.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
 #bannerTitle { font-family: Georgia, serif; font-size: 32px; font-weight: 800; color: var(--gold-bright); letter-spacing: 0.03em; }
 #bannerSub { font-size: 14px; color: #e2e8f0; margin-top: 4px; font-weight: 600; }

 .modal-bg {
 position: fixed; inset: 0; background: rgba(6,12,12,0.82); backdrop-filter: blur(8px);
 display: none; align-items: center; justify-content: center; z-index: 40; padding: 18px;
 }
 .modal-bg.open { display: flex; }
 .modal {
 background: #101f1f; border: 1px solid var(--border); border-radius: 20px;
 max-width: 780px; width: 100%; padding: 24px; box-shadow: 0 25px 70px rgba(0,0,0,0.78);
 }
 table.sc { width: 100%; border-collapse: collapse; font-size: 14px; margin: 16px 0 20px; }
 table.sc th, table.sc td { padding: 8px 5px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.08); }
 table.sc th { color: var(--muted); font-size: 11px; text-transform: uppercase; }
 .under { color: #34d399; font-weight: 800; }
 .even { color: #f8fafc; font-weight: 700; }
 .over { color: var(--gold); font-weight: 700; }
 #loader {
 position: fixed; inset: 0; background: #0d1818; display: flex; flex-direction: column;
 align-items: center; justify-content: center; z-index: 100; gap: 10px; transition: opacity 0.45s;
 }
 @media (max-width: 780px) {
 .atm-lbl { display: none; }
 .pill { padding: 3px 6px; font-size: 10px; }
 .slider-grp { width: 110px; }
 .cam-rail { display: none; }
 }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<canvas id="glCanvas"></canvas>

<!-- Top-Left Brand + Hole Info -->
<div class="brand-stack">
 <div style="display:flex; align-items:center; gap:10px; pointer-events:auto;">
 <a href="../index.html" style="text-decoration:none; background:rgba(16,30,29,0.84); border:1px solid rgba(235,215,175,0.28); color:#f5d89a; font-size:11px; font-weight:800; padding:6px 10px; border-radius:10px; backdrop-filter:blur(10px);">◀ Courses</a>

<!-- Right-Side Camera Controls -->
<div class="cam-rail">

<!-- Bottom Precision & Drag-to-Putt Dock -->
<div class="bottom-dock">

<script>
(() => {
 // =========================================================================
 // 0. NOISE & SOBEL HEIGHT-TO-NORMAL MAP UTILITIES
 // =========================================================================
 function hash2(x, y) {
 const h = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
 return h - Math.floor(h);
 }
 function noise2(x, y) {
 const ix = Math.floor(x), iy = Math.floor(y);
 const fx = x - ix, fy = y - iy;
 const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
 const a = hash2(ix, iy), b = hash2(ix + 1, iy);
 const c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
 return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
 }
 function fbm(x, y, octaves = 5) {
 let v = 0, amp = 0.5, freq = 1.0;
 for (let i = 0; i < octaves; i++) {
 v += amp * noise2(x * freq, y * freq);
 freq *= 2.04; amp *= 0.5;
 }
 return v;
 }
 function ridgedFbm(x, y, octaves = 5) {
 let v = 0, amp = 0.52, freq = 1.0, weight = 1.0;
 for (let i = 0; i < octaves; i++) {
 let n = 1.0 - Math.abs(noise2(x * freq, y * freq) * 2.0 - 1.0);
 n = n * n * weight;
 weight = Math.min(1.0, Math.max(0.0, n * 1.8));
 v += n * amp;
 freq *= 2.08; amp *= 0.48;
 }
 return v;
 }

 function heightCanvasToNormalTexture(heightCanvas, strength = 2.2) {
 const w = heightCanvas.width, h = heightCanvas.height;
 const src = heightCanvas.getContext('2d').getImageData(0, 0, w, h).data;
 const outC = document.createElement('canvas'); outC.width = w; outC.height = h;
 const outCtx = outC.getContext('2d');
 const dst = outCtx.createImageData(w, h);
 const d = dst.data;
 const getH = (x, y) => src[(((y + h) % h) * w + ((x + w) % w)) * 4] / 255.0;
 for (let y = 0; y < h; y++) {
 for (let x = 0; x < w; x++) {
 const tl = getH(x - 1, y - 1), l = getH(x - 1, y), bl = getH(x - 1, y + 1);
 const t = getH(x, y - 1), b = getH(x, y + 1);
 const tr = getH(x + 1, y - 1), r = getH(x + 1, y), br = getH(x + 1, y + 1);
 const dx = (tr + 2 * r + br) - (tl + 2 * l + bl);
 const dy = (bl + 2 * b + br) - (tl + 2 * t + tr);
 let nx = -dx * strength, ny = -dy * strength, nz = 1.0;
 const len = Math.hypot(nx, ny, nz) || 1;
 nx /= len; ny /= len; nz /= len;
 const idx = (y * w + x) * 4;
 d[idx] = Math.round((nx * 0.5 + 0.5) * 255);
 d[idx + 1] = Math.round((ny * 0.5 + 0.5) * 255);
 d[idx + 2] = Math.round((nz * 0.5 + 0.5) * 255);
 d[idx + 3] = 255;
 }
 }
 outCtx.putImageData(dst, 0, 0);
 const tex = new THREE.CanvasTexture(outC);
 tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.anisotropy = 8;
 return tex;
 }

 // =========================================================================
 // 1. PAINTERLY PHOTOREALISTIC PBR TEXTURE SUITE
 // =========================================================================
 function createGrassPBR() {
 const size = 512;
 const c = document.createElement('canvas'); c.width = c.height = size;
 const ctx = c.getContext('2d');
 const hC = document.createElement('canvas'); hC.width = hC.height = size;
 const hctx = hC.getContext('2d');

 // Warm sunlit manicured emerald-jade green (matches serene Zen garden aesthetic)
 ctx.fillStyle = '#206b1a'; ctx.fillRect(0, 0, size, size);
 hctx.fillStyle = '#757575'; hctx.fillRect(0, 0, size, size);

 for (let x = 0; x < size; x += 64) {
 ctx.fillStyle = (x / 64) % 2 === 0 ? 'rgba(255,255,240,0.032)' : 'rgba(0,25,0,0.036)';
 ctx.fillRect(x, 0, 64, size);
 }
 for (let i = 0; i < 240; i++) {
 const x = Math.random() * size, y = Math.random() * size, r = 18 + Math.random() * 44;
 const g = ctx.createRadialGradient(x, y, 2, x, y, r);
 g.addColorStop(0, Math.random() > 0.5 ? 'rgba(116, 184, 56, 0.16)' : 'rgba(34, 88, 22, 0.18)');
 g.addColorStop(1, 'rgba(0,0,0,0)');
 ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
 }
 for (let i = 0; i < 34000; i++) {
 const x = Math.random() * size, y = Math.random() * size;
 const len = 3 + Math.random() * 6, ang = (Math.random() - 0.5) * 1.1, t = Math.random();
 ctx.strokeStyle = t > 0.72 ? '#42a826' : (t > 0.34 ? '#277d1c' : '#144d0f');
 ctx.lineWidth = 1.05;
 ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + Math.sin(ang) * len, y - Math.cos(ang) * len); ctx.stroke();
 const bv = Math.floor(88 + t * 155);
 hctx.strokeStyle = `rgb(${bv},${bv},${bv})`;
 hctx.beginPath(); hctx.moveTo(x, y); hctx.lineTo(x + Math.sin(ang) * len, y - Math.cos(ang) * len); hctx.stroke();
 }
 const map = new THREE.CanvasTexture(c), normalMap = heightCanvasToNormalTexture(hC, 1.4); map.encoding = THREE.sRGBEncoding;
 map.wrapS = map.wrapT = THREE.RepeatWrapping;
 map.repeat.set(0.18, 0.18); normalMap.repeat.set(0.18, 0.18); map.anisotropy = 8;
 return { map, normalMap };
 }

 // TWO-TONE SCULPTED TRAVERTINE + FIELDSTONE BASE WALL PBR (Matches high-end Zen masonry!)
 function createTravertineWallPBR() {
 const size = 512;
 const c = document.createElement('canvas'); c.width = c.height = size;
 const ctx = c.getContext('2d');
 const hC = document.createElement('canvas'); hC.width = hC.height = size;
 const hctx = hC.getContext('2d');

 // Warm sunlit travertine sandstone base
 ctx.fillStyle = '#d4b58f'; ctx.fillRect(0, 0, size, size);
 hctx.fillStyle = '#858585'; hctx.fillRect(0, 0, size, size);

 // Subtle warm plaster/travertine mottling across the whole wall
 for (let i = 0; i < 650; i++) {
 const x = Math.random() * size, y = Math.random() * size;
 const rx = 14 + Math.random() * 52, ry = 8 + Math.random() * 24, rot = Math.random() * Math.PI;
 ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
 const g = ctx.createRadialGradient(0, 0, 2, 0, 0, rx);
 const light = Math.random() > 0.45;
 g.addColorStop(0, light ? 'rgba(248, 232, 206, 0.24)' : 'rgba(150, 112, 74, 0.22)');
 g.addColorStop(1, 'rgba(0,0,0,0)');
 ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
 ctx.restore();

 hctx.save(); hctx.translate(x, y); hctx.rotate(rot);
 const bg = hctx.createRadialGradient(0, 0, 1, 0, 0, rx * 0.75);
 bg.addColorStop(0, light ? 'rgba(210,210,210,0.18)' : 'rgba(50,50,50,0.18)');
 bg.addColorStop(1, 'rgba(128,128,128,0)');
 hctx.fillStyle = bg; hctx.beginPath(); hctx.ellipse(0, 0, rx * 0.75, ry * 0.75, 0, 0, Math.PI * 2); hctx.fill();
 hctx.restore();
 }

 // Darker weathered fieldstone/cobble skirting along the lower outer wall edge (v near 0.0 and 0.85..1.0)
 function drawStoneSkirting(yStart, yEnd) {
 for (let i = 0; i < 180; i++) {
 const x = Math.random() * size;
 const y = yStart + Math.random() * (yEnd - yStart);
 const rw = 16 + Math.random() * 26, rh = 9 + Math.random() * 14;

 // FINE, CREAMY-CHAMPAGNE RAKED ZEN SAND COURTYARD PBR (High frequency delicate grooves!)
 function createCourtyardSandPBR() {
 const size = 1024, worldSpan = 108.0;
 const c = document.createElement('canvas'); c.width = c.height = size;
 const ctx = c.getContext('2d');
 const hC = document.createElement('canvas'); hC.width = hC.height = size;
 const hctx = hC.getContext('2d');

 const imgA = ctx.createImageData(size, size), imgH = hctx.createImageData(size, size);
 const dA = imgA.data, dH = imgH.data;

 // Concentric raked rings around our sculpted courtyard crags & boulders
 const rocks = [
 [-11.5, -2.5], [-13.0, 5.5], [13.0, -7.5], [13.5, 4.5], [0.0, -22.5]
 ];

 for (let py = 0; py < size; py++) {
 const wz = (py / size - 0.5) * worldSpan;
 for (let px = 0; px < size; px++) {
 const wx = (px / size - 0.5) * worldSpan;
 // Delicate, fine parallel S-wave Zen raking (frequency = 11.5 for crisp fine grooves!)
 const baseWave = wz + Math.sin(wx * 0.08) * 2.1 + Math.cos(wx * 0.04) * 1.2;
 let groove = Math.sin(baseWave * 11.5);
 for (let r = 0; r < rocks.length; r++) {
 const d = Math.hypot(wx - rocks[r][0], wz - rocks[r][1]);
 if (d < 7.2) {
 const t = Math.max(0, Math.min(1, (7.2 - d) / 4.2));
 const smooth = t * t * (3 - 2 * t);
 groove = groove * (1 - smooth) + Math.sin(d * 11.8) * smooth;
 }
 }

 const grain = hash2(px * 0.77, py * 0.77) * 0.08 + noise2(wx * 2.2, wz * 2.2) * 0.08;
 const g01 = groove * 0.5 + 0.5;

 // Warm champagne-cream Zen sand palette (bright, serene, sunlit!)
 const sr = (202 + g01 * 34) * (0.94 + grain);
 const sg = (180 + g01 * 30) * (0.94 + grain);
 const sb = (136 + g01 * 24) * (0.94 + grain);

 const idx = (py * size + px) * 4;
 dA[idx] = Math.min(255, sr);
 dA[idx + 1] = Math.min(255, sg);
 dA[idx + 2] = Math.min(255, sb);
 dA[idx + 3] = 255;

 const hVal = Math.max(0, Math.min(255, g01 * 215 + grain * 120));
 dH[idx] = dH[idx + 1] = dH[idx + 2] = hVal;
 dH[idx + 3] = 255;
 }
 }
 ctx.putImageData(imgA, 0, 0);
 hctx.putImageData(imgH, 0, 0);
 const map = new THREE.CanvasTexture(c), normalMap = heightCanvasToNormalTexture(hC, 1.9); map.encoding = THREE.sRGBEncoding;
 map.anisotropy = 8;
 return { map, normalMap };
 }

 const matWaterShader = new THREE.ShaderMaterial({
 transparent: true, uniforms: waterUniforms,
 vertexShader: `
 uniform float uTime; varying vec2 vUv; varying vec3 vWorldPos;
 void main() {
 vUv = uv; vec3 p = position;
 p.z += sin(p.x * 1.4 + uTime * 2.1) * 0.02 + cos(p.y * 1.6 - uTime * 1.7) * 0.02;
 vec4 wp = modelMatrix * vec4(p, 1.0); vWorldPos = wp.xyz;
 gl_Position = projectionMatrix * viewMatrix * wp;
 }
 `,
 fragmentShader: `
 uniform float uTime; uniform vec3 uDeepColor; uniform vec3 uShallowColor;
 uniform vec3 uSkyColor; uniform vec3 uSunDir; uniform vec3 uSunColor; uniform float uRain;
 varying vec2 vUv; varying vec3 vWorldPos;
 float waveHeight(vec2 p, float t) {
 float w = sin(p.x * 2.2 + t * 1.9 + sin(p.y * 1.5)) * 0.24
 + cos(p.y * 2.8 - t * 1.5 + cos(p.x * 1.8)) * 0.22
 + sin((p.x + p.y) * 3.6 + t * 2.4) * 0.14;
 if (uRain > 0.1) {
 vec2 cell = floor(p * 1.4), f = fract(p * 1.4) - 0.5;
 float phase = fract(t * 1.4 + fract(sin(dot(cell, vec2(12.9898, 78.233))) * 43758.5453));
 w += smoothstep(0.08, 0.0, abs(length(f) - phase * 0.45)) * (1.0 - phase) * 0.65 * uRain;
 }
 return w;
 }
 void main() {
 vec2 p = vWorldPos.xz; float distC = length(vUv - 0.5) * 2.0, eps = 0.08;
 vec3 N = normalize(vec3(waveHeight(p-vec2(eps,0), uTime) - waveHeight(p+vec2(eps,0), uTime), 1.8,
 waveHeight(p-vec2(0,eps), uTime) - waveHeight(p+vec2(0,eps), uTime)));
 vec3 V = normalize(cameraPosition - vWorldPos);
 float fresnel = pow(1.0 - max(dot(N, V), 0.0), 3.2);
 float caustics = pow(max(0.0, sin(p.x * 3.5 + uTime * 2.2) * cos(p.y * 3.5 - uTime * 1.8)), 3.0);
 vec3 waterCol = mix(uDeepColor, uShallowColor, smoothstep(0.25, 0.92, distC))

 vec3 col = mix(waterCol, uSkyColor, clamp(fresnel * 0.80 + 0.12, 0.0, 0.9));
 vec3 H = normalize(normalize(uSunDir) + V);
 col += uSunColor * pow(max(dot(N, H), 0.0), 96.0) * (1.1 - uRain * 0.6);
 float foam = smoothstep(0.86, 0.97, distC) * (0.5 + 0.5 * sin(uTime * 2.5 + p.x * 3.0));

 }

  // DETAILED, MULTI-STRATA MISTY JADE MOUNTAIN RANGE WITH VALLEY RIDGES & SNOW/MIST PEAKS
  function buildSereneMountainRange() {
    const segs = 192, size = 360;
    const geo = new THREE.PlaneGeometry(size, size, segs, segs);
    geo.rotateX(-Math.PI / 2);
    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);

    const colPineBase = new THREE.Color(0x284b2c);
    const colForest   = new THREE.Color(0x235247);
    const colSlate    = new THREE.Color(0x2b3e52);
    const colGranite  = new THREE.Color(0x4a5d70);
    const colMistCap  = new THREE.Color(0x9bb2c4);
    const tmpCol = new THREE.Color();

    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      const dist = Math.hypot(x, z);

      // Keep courtyard & mid-ground landmarks clear, then rise into sculpted alpine/jade peaks
      const mtnMask = Math.max(0, Math.min(1, (dist - 40) / 36));
      const sm = mtnMask * mtnMask * (3 - 2 * mtnMask);

      let h = -0.6;
      if (sm > 0.0005) {
        const macro = fbm(x * 0.014 + 2.4, z * 0.014 - 1.7, 5) * 9.5;
        const ridgeA = ridgedFbm(x * 0.018 - 3.1, z * 0.018 + 2.6, 5) * 21.0;
        const ridgeB = ridgedFbm(x * 0.036 + 7.2, z * 0.036 - 4.8, 4) * 5.2;
        const valleyDip = 0.72 + 0.28 * Math.sin(x * 0.025 + 0.8) * Math.cos(z * 0.022 - 0.5);
        const outerRise = Math.max(0, (dist - 88) * 0.075);
        h = -0.35 + sm * ((macro + ridgeA + ridgeB) * valleyDip + outerRise);
      }
      pos.setY(i, h);

      // Elevation + craggy noise color strata so every slope & ridge has crisp definition
      const cragJitter = (noise2(x * 0.09, z * 0.09) - 0.5) * 2.6 + (noise2(x * 0.24, z * 0.24) - 0.5) * 1.1;
      const eh = Math.max(0, h + cragJitter);
      if (eh < 5.5) {
        tmpCol.copy(colPineBase).lerp(colForest, eh / 5.5);
      } else if (eh < 12.5) {
        tmpCol.copy(colForest).lerp(colSlate, (eh - 5.5) / 7.0);
      } else if (eh < 19.5) {
        tmpCol.copy(colSlate).lerp(colGranite, (eh - 12.5) / 7.0);
      } else {
        tmpCol.copy(colGranite).lerp(colMistCap, Math.min(1, (eh - 19.5) / 7.5));
      }

      colors[i * 3] = tmpCol.r;
      colors[i * 3 + 1] = tmpCol.g;
      colors[i * 3 + 2] = tmpCol.b;
    }

    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    // Convert to non-indexed flat-faceted normals so every mountain ridge catches directional sun & shadow!
    const facetedGeo = geo.toNonIndexed();
    facetedGeo.computeVertexNormals();

    const mtnNormal = cliffPBR.normalMap.clone();
    mtnNormal.needsUpdate = true;
    mtnNormal.repeat.set(28, 28);

    const terrain = new THREE.Mesh(facetedGeo, new THREE.MeshStandardMaterial({
      vertexColors: true,
      normalMap: mtnNormal,
      normalScale: new THREE.Vector2(1.35, 1.35),
      roughness: 0.90,
      metalness: 0.03,
      envMapIntensity: 0.28
    }));
    terrain.receiveShadow = true;
    envGroup.add(terrain);

    // Distant misty foothill ridges along the horizon for atmospheric depth
    const hillMat = new THREE.MeshStandardMaterial({
      color: 0x3b6356,
      roughness: 0.94,
      metalness: 0.01,
      envMapIntensity: 0.2
    });
    const foothillSpecs = [
      [-68, -62, 16, 11, 14, 0.4],
      [-34, -74, 19, 13, 15, -0.3],
      [ 28, -76, 18, 12, 15, 0.5],
      [ 66, -64, 17, 11, 14, -0.4],
      [-82, -18, 15, 10, 16, 0.2],
      [ 82, -22, 16, 10, 16, -0.2]
    ];
    foothillSpecs.forEach(([hx, hz, sx, sy, sz, ry], idx) => {
      const hGeo = new THREE.ConeGeometry(1.0, 1.0, 9, 3);
      const hp = hGeo.attributes.position;
      for (let k = 0; k < hp.count; k++) {
        const vx = hp.getX(k), vy = hp.getY(k), vz = hp.getZ(k);
        const n = 0.80 + 0.34 * ridgedFbm(vx * 1.4 + idx * 3.1, vz * 1.4 + vy * 1.1, 3);
        hp.setXYZ(k, vx * n, vy, vz * n);
      }
      const flatH = hGeo.toNonIndexed();
      flatH.computeVertexNormals();
      const ridge = new THREE.Mesh(flatH, hillMat);
      ridge.position.set(hx, sy * 0.45 - 0.3, hz);
      ridge.scale.set(sx, sy, sz);
      ridge.rotation.y = ry;
      ridge.receiveShadow = true;
      envGroup.add(ridge);
    });
  }
  buildSereneMountainRange();

 // 6. CURVED & ROUNDED-CORNER FAIRWAY / TWO-TONE TRAVERTINE WALL GENERATORS
 // =========================================================================
 function createRoundedPolygon(verts, arcSteps = 8) {
 const pts = [], n = verts.length;
 for (let i = 0; i < n; i++) {
 const prev = verts[(i - 1 + n) % n], curr = verts[i], next = verts[(i + 1) % n], r = curr.r || 0;
 if (r <= 0.01) { pts.push({ x: curr.x, z: curr.z }); continue; }
 const v1x = prev.x - curr.x, v1z = prev.z - curr.z, v2x = next.x - curr.x, v2z = next.z - curr.z;
 const l1 = Math.hypot(v1x, v1z), l2 = Math.hypot(v2x, v2z);
 const u1x = v1x / l1, u1z = v1z / l1, u2x = v2x / l2, u2z = v2z / l2;
 const dot = Math.max(-0.999, Math.min(0.999, u1x * u2x + u1z * u2z));
 const halfAng = Math.acos(dot) / 2;
 const tanDist = Math.min(r / Math.tan(halfAng), l1 * 0.45, l2 * 0.45), effR = tanDist * Math.tan(halfAng);
 const pStart = { x: curr.x + u1x * tanDist, z: curr.z + u1z * tanDist };
 const pEnd = { x: curr.x + u2x * tanDist, z: curr.z + u2z * tanDist };
 const bx = u1x + u2x, bz = u1z + u2z, bl = Math.hypot(bx, bz), cDist = effR / Math.sin(halfAng);
 const cx = curr.x + (bx / bl) * cDist, cz = curr.z + (bz / bl) * cDist;
 let a1 = Math.atan2(pStart.z - cz, pStart.x - cx), a2 = Math.atan2(pEnd.z - cz, pEnd.x - cx), diff = a2 - a1;
 while (diff > Math.PI) diff -= Math.PI * 2;
 while (diff < -Math.PI) diff += Math.PI * 2;
 for (let s = 0; s <= arcSteps; s++) {
 const a = a1 + diff * (s / arcSteps);
 pts.push({ x: cx + Math.cos(a) * effR, z: cz + Math.sin(a) * effR });
 }
 }
 return pts;
 }

 function createCurvedCorridor(spineCoords, halfW, samples = 48) {
 const curve = new THREE.CatmullRomCurve3(spineCoords.map(p => new THREE.Vector3(p[0], 0, p[1])));
 const leftPts = [], rightPts = [];
 for (let i = 0; i <= samples; i++) {
 const t = i / samples, p = curve.getPoint(t), tan = curve.getTangent(t);
 const nx = -tan.z, nz = tan.x;
 leftPts.push({ x: p.x - nx * halfW, z: p.z - nz * halfW });
 rightPts.push({ x: p.x + nx * halfW, z: p.z + nz * halfW });
 }
 const pts = [];
 for (let i = 0; i <= samples; i++) pts.push(rightPts[i]);
 const endP = curve.getPoint(1), endTan = curve.getTangent(1), endBaseA = Math.atan2(endTan.x, -endTan.z);
 for (let s = 1; s < 12; s++) {
 const a = endBaseA - (s / 12) * Math.PI;
 pts.push({ x: endP.x + Math.cos(a) * halfW, z: endP.z + Math.sin(a) * halfW });
 }
 for (let i = samples; i >= 0; i--) pts.push(leftPts[i]);
 const startP = curve.getPoint(0), startTan = curve.getTangent(0), startBaseA = Math.atan2(-startTan.x, startTan.z);
 for (let s = 1; s < 12; s++) {
 const a = startBaseA - (s / 12) * Math.PI;
 pts.push({ x: startP.x + Math.cos(a) * halfW, z: startP.z + Math.sin(a) * halfW });
 }
 return pts;
 }

 function ensureOutwardWinding(pts, wantOutward = true) {
 let area = 0;
 for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; area += (a.x * b.z - b.x * a.z); }
 if ((wantOutward && area < 0) || (!wantOutward && area > 0)) pts.reverse();
 return pts;
 }

 function buildCurvedStoneWallMesh(loopPts, wallHeight = 0.92, wallThick = 0.56, isInnerIsland = false) {
 const n = loopPts.length;
 const profile = [
 [0.0, 0.0, 0.0], [0.0, wallHeight - 0.13, 0.42], [0.10, wallHeight, 0.52],
 [wallThick - 0.10, wallHeight, 0.70], [wallThick, wallHeight - 0.13, 0.80], [wallThick, 0.0, 1.0]
 ];
 const pLen = profile.length, positions = [], uvs = [], indices = [], normals = [];
 const dirSign = isInnerIsland ? -1 : 1;
 for (let i = 0; i < n; i++) {
 const pPrev = loopPts[(i - 1 + n) % n], pCurr = loopPts[i], pNext = loopPts[(i + 1) % n];
 const e1x = pCurr.x - pPrev.x, e1z = pCurr.z - pPrev.z, e2x = pNext.x - pCurr.x, e2z = pNext.z - pCurr.z;
 const l1 = Math.hypot(e1x, e1z) || 1, l2 = Math.hypot(e2x, e2z) || 1;
 const n1x = (e1z / l1) * dirSign, n1z = (-e1x / l1) * dirSign, n2x = (e2z / l2) * dirSign, n2z = (-e2x / l2) * dirSign;
 let mx = n1x + n2x, mz = n1z + n2z; const ml = Math.hypot(mx, mz) || 1; mx /= ml; mz /= ml;
 const miter = Math.min(1.6, 1.0 / Math.max(0.55, mx * n1x + mz * n1z));
 normals.push({ x: mx * miter, z: mz * miter });
 }
 let arcDist = 0;
 for (let i = 0; i <= n; i++) {
 const idx = i % n, pt = loopPts[idx], nm = normals[idx];
 if (i > 0) { const prev = loopPts[(i - 1) % n]; arcDist += Math.hypot(pt.x - prev.x, pt.z - prev.z); }
 for (let j = 0; j < pLen; j++) {
 positions.push(pt.x + nm.x * profile[j][0], profile[j][1], pt.z + nm.z * profile[j][0]);
 uvs.push(arcDist * 0.25, profile[j][2]);
 }
 }
 for (let i = 0; i < n; i++) {
 const rowA = i * pLen, rowB = (i + 1) * pLen;
 for (let j = 0; j < pLen - 1; j++) {
 const a = rowA + j, b = rowB + j, c = rowB + j + 1, d = rowA + j + 1;
 if (!isInnerIsland) indices.push(a, b, c, a, c, d);
 else indices.push(a, c, b, a, d, c);
 }
 }
 const geo = new THREE.BufferGeometry();
 geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
 geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
 geo.setIndex(indices); geo.computeVertexNormals();
 const mesh = new THREE.Mesh(geo, matWall);
 mesh.castShadow = true; mesh.receiveShadow = true; return mesh;
 }

 function buildFairwayTurfMesh(outerPts, islandPts = null) {
 const shape = new THREE.Shape();
 outerPts.forEach((p, i) => { if (i === 0) shape.moveTo(p.x, -p.z); else shape.lineTo(p.x, -p.z); });
 shape.closePath();
 if (islandPts) {
 const holePath = new THREE.Path();
 islandPts.forEach((p, i) => { if (i === 0) holePath.moveTo(p.x, -p.z); else holePath.lineTo(p.x, -p.z); });
 holePath.closePath(); shape.holes.push(holePath);
 }
 const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.24, bevelEnabled: false, curveSegments: 1 });
 const mesh = new THREE.Mesh(geo, matGrass);
 mesh.rotation.x = -Math.PI / 2; mesh.receiveShadow = true; return mesh;
 }

 function clearGroup(grp) { while (grp.children.length > 0) grp.remove(grp.children[0]); }
 function pointInPoly(x, z, pts) {
 let inside = false;
 for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
 const xi = pts[i].x, zi = pts[i].z, xj = pts[j].x, zj = pts[j].z;
 if (((zi > z) !== (zj > z)) && (x < (xj - xi) * (z - zi) / ((zj - zi) || 1e-9) + xi)) inside = !inside;
 }
 return inside;
 }
 function minDistToPoly(x, z, pts) {
 let minD = Infinity;
 for (let i = 0; i < pts.length; i++) {
 const a = pts[i], b = pts[(i + 1) % pts.length];
 const vx = b.x - a.x, vz = b.z - a.z, l2 = vx * vx + vz * vz || 1;
 const t = Math.max(0, Math.min(1, ((x - a.x) * vx + (z - a.z) * vz) / l2));
 const d = Math.hypot(x - (a.x + t * vx), z - (a.z + t * vz));
 if (d < minD) minD = d;
 }
 return minD;
 }

 function syncSlidersFromState() {

 while (deg > 180) deg -= 360;

 function executePutt() {
 if (!ballStopped() || state.aimPower < 0.04) return;
 initAudio();
 const spd = state.aimPower * 21.0;
 state.ball.lastSafeX = state.ball.x; state.ball.lastSafeZ = state.ball.z;
 state.ball.vx = Math.sin(state.aimAngle) * spd;

 });

 });

 const raycaster = new THREE.Raycaster();
 const pointerNDC = new THREE.Vector2();
 const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.24);
 let dragMode = null, lastPointer = { x: 0, y: 0 };

 function getGroundHit(clientX, clientY) {
 pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
 pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
 raycaster.setFromCamera(pointerNDC, camera);
 const hit = new THREE.Vector3();
 raycaster.ray.intersectPlane(groundPlane, hit);
 return hit;
 }

 function ballStopped() { return !state.ball.inHole && state.ball.y <= 0.24 + ballRadius + 0.04 && Math.abs(state.ball.vy) < 0.1 && Math.hypot(state.ball.vx, state.ball.vz) < 0.08; }

 canvas.addEventListener('pointerdown', e => {
 initAudio(); lastPointer = { x: e.clientX, y: e.clientY };
 const hit = getGroundHit(e.clientX, e.clientY);
 if (ballStopped() && hit && Math.hypot(hit.x - state.ball.x, hit.z - state.ball.z) < 2.1) {
 dragMode = 'aim'; state.aiming = true;
 canvas.setPointerCapture(e.pointerId); return;
 }
 dragMode = 'orbit'; canvas.setPointerCapture(e.pointerId);
 });

 canvas.addEventListener('pointermove', e => {
 if (!dragMode) return;
 if (dragMode === 'orbit') {
 const dx = e.clientX - lastPointer.x, dy = e.clientY - lastPointer.y;
 lastPointer = { x: e.clientX, y: e.clientY };
 state.camYaw -= dx * 0.0065;
 state.camPitch = Math.max(0.16, Math.min(1.25, state.camPitch + dy * 0.0055));
 } else if (dragMode === 'aim') {
 const hit = getGroundHit(e.clientX, e.clientY);
 if (hit) {
 const dx = state.ball.x - hit.x, dz = state.ball.z - hit.z;
 state.aimPower = Math.max(0.05, Math.min(1, Math.hypot(dx, dz) / 4.2));
 state.aimAngle = Math.atan2(dx, dz);
 syncSlidersFromState();
 }
 }
 });

 canvas.addEventListener('pointerup', () => {
 if (dragMode === 'aim' && state.aiming) {
 state.aiming = false;
 executePutt();
 }
 dragMode = null;
 });

 canvas.addEventListener('wheel', e => {
 state.camDist = Math.max(4.8, Math.min(23.0, state.camDist + e.deltaY * 0.008));
 }, { passive: true });

 // =========================================================================
 // 11. 16x SUB-STEPPED PHYSICS & LIVE BANK-BOUNCE PREVIEW
 // =========================================================================
 function collideWall2D(ball, x1, z1, x2, z2, rest = 0.84, silent = false) {
 const vx = x2 - x1, vz = z2 - z1, lenSq = vx * vx + vz * vz;
 if (lenSq === 0) return;
 const t = Math.max(0, Math.min(1, ((ball.x - x1) * vx + (ball.z - z1) * vz) / lenSq));
 const cx = x1 + t * vx, cz = z1 + t * vz;
 const dx = ball.x - cx, dz = ball.z - cz, dist = Math.hypot(dx, dz);
 if (dist < ballRadius && dist > 0.00001) {
 const nx = dx / dist, nz = dz / dist;
 ball.x += nx * (ballRadius - dist); ball.z += nz * (ballRadius - dist);
 const vn = ball.vx * nx + ball.vz * nz;
 if (vn < 0) {
 if (!silent) { sfxBounce(Math.abs(vn), false); if (Math.abs(vn) > 5) spawnFX(cx, 0.38, cz, 0xfde68a, 5, 2.8); }
 ball.vx -= (1 + rest) * vn * nx; ball.vz -= (1 + rest) * vn * nz;
 }
 }
 }

 function collideCircle2D(ball, cx, cz, cr, rest = 1.1, extraKick = 2.8, silent = false) {
 const dx = ball.x - cx, dz = ball.z - cz, dist = Math.hypot(dx, dz), minD = ballRadius + cr;
 if (dist < minD && dist > 0.00001) {
 const nx = dx / dist, nz = dz / dist;
 ball.x = cx + nx * minD; ball.z = cz + nz * minD;
 const vn = ball.vx * nx + ball.vz * nz;
 if (vn < 0) {
 ball.vx -= (1 + rest) * vn * nx; ball.vz -= (1 + rest) * vn * nz;
 if (extraKick > 0) { ball.vx += nx * extraKick; ball.vz += nz * extraKick; }
 if (!silent) { sfxBounce(Math.max(Math.abs(vn), extraKick * 4), extraKick > 0); spawnFX(cx + nx * cr, 0.42, cz + nz * cr, 0x38bdf8, 12, 4.2); }
 }
 }
 }

 function updateAimAndPutter() {
 const stopped = ballStopped();
 aimGroup.visible = stopped && state.guideOn;
 if (stopped && state.putterSwingT <= 0) {
 putterGroup.visible = true;
 const pullBack = 0.36 + (state.aiming ? state.aimPower * 1.1 : state.aimPower * 0.45);
 putterGroup.position.set(state.ball.x - Math.sin(state.aimAngle) * pullBack, 0.24, state.ball.z - Math.cos(state.aimAngle) * pullBack);
 putterGroup.rotation.y = state.aimAngle;
 } else if (state.putterSwingT <= 0) {
 putterGroup.visible = false;
 }

 if (!aimGroup.visible) return;
 const hole = HOLES[state.holeIdx];
 const col = state.aimPower < 0.45 ? 0x34d399 : (state.aimPower < 0.8 ? 0xf5d89a : 0xef4444);
 const sim = {
 x: state.ball.x, z: state.ball.z,
 vx: Math.sin(state.aimAngle) * Math.max(4.5, state.aimPower * 21.0),
 vz: Math.cos(state.aimAngle) * Math.max(4.5, state.aimPower * 21.0)
 };
 const stepDt = 0.022;
 for (let i = 0; i < aimDots.length; i++) {
 for (let s = 0; s < 3; s++) {
 sim.x += sim.vx * (stepDt / 3); sim.z += sim.vz * (stepDt / 3);
 for (const seg of state.wallSegs) collideWall2D(sim, seg[0], seg[1], seg[2], seg[3], 0.84, true);
 for (const bmp of hole.bumpers) collideCircle2D(sim, bmp.x, bmp.z, bmp.r, 1.1, 2.8, true);
 }
 aimDots[i].position.set(sim.x, 0.33, sim.z); aimDots[i].material.color.setHex(col);
 }
 }

 function stepPhysics(dt) {
 const hole = HOLES[state.holeIdx], b = state.ball;
 if (state.bannerT > 0) { state.bannerT -= dt; if (state.bannerT <= 0) document.getElementById('banner').classList.remove('show'); }

 if (state.putterSwingT > 0) {
 state.putterSwingT -= dt;
 putterGroup.position.x += Math.sin(state.aimAngle) * dt * 6.5;
 putterGroup.position.z += Math.cos(state.aimAngle) * dt * 6.5;
 if (state.putterSwingT <= 0) putterGroup.visible = false;
 }

 for (let i = fxParticles.length - 1; i >= 0; i--) {
 const p = fxParticles[i];
 p.mesh.position.x += p.vx * dt; p.mesh.position.y += p.vy * dt; p.mesh.position.z += p.vz * dt;
 p.vy -= 12.0 * dt; p.life -= dt;
 p.mesh.scale.setScalar(Math.max(0.01, p.life));
 if (p.life <= 0) { scene.remove(p.mesh); fxParticles.splice(i, 1); }
 }

 if (b.inHole) {
 b.sinkT += dt; b.y = Math.max(-0.22, 0.24 + ballRadius - b.sinkT * 1.15);
 state.nextHoleT -= dt;
 if (state.nextHoleT <= 0) {
 if (state.holeIdx < HOLES.length - 1) buildHole(state.holeIdx + 1);
 else showScorecard(true);
 }
 return;
 }

 // Animate rotating windmills & moving stone gates
 const tSec = performance.now() * 0.001;
 state.dynWindmills.forEach(wm => {
 wm.angle += wm.def.speed * dt;
 wm.rotor.rotation.z = wm.angle;
 });
 state.dynMovers.forEach(mv => {
 const d = mv.def;
 mv.x = d.cx + Math.sin(tSec * d.speed + d.phase) * d.ampX;
 mv.z = d.cz + Math.cos(tSec * d.speed + d.phase) * d.ampZ;
 mv.mesh.position.set(mv.x, 0.24, mv.z);
 });
 if (b.portalCD > 0) b.portalCD -= dt;

 const groundY = 0.24 + ballRadius;
 const sub = 16, sdt = dt / sub;
 for (let s = 0; s < sub; s++) {
 const airborne = b.y > groundY + 0.05;

 // Vertical parabolic jump physics
 if (airborne || b.vy > 0) {
 b.vy -= 22.0 * sdt;
 b.y += b.vy * sdt;
 if (b.y <= groundY) {
 b.y = groundY;
 if (Math.abs(b.vy) > 2.2) {
 sfxBounce(Math.abs(b.vy) * 1.4, false);
 spawnFX(b.x, 0.28, b.z, 0xe2e8f0, 6, 2.6);
 b.vy = -b.vy * 0.36;
 } else {
 b.vy = 0;
 }
 }
 }

 // Ground-only interactions (slopes, ramps, boosts, bunkers, waters, portals)
 let inSand = false;
 if (!airborne) {
 hole.slopes.forEach(sl => {
 if (b.x >= sl.x1 && b.x <= sl.x2 && b.z >= sl.z1 && b.z <= sl.z2) { b.vx += sl.fx * sdt; b.vz += sl.fz * sdt; }
 });
 (hole.ramps || []).forEach(rp => {
 if (Math.abs(b.x - rp.x) <= rp.w * 0.5 && Math.abs(b.z - rp.z) <= rp.d * 0.5) {
 const forwardSpd = b.vx * rp.dirX + b.vz * rp.dirZ;
 if (forwardSpd > 2.4 && b.vy <= 0.1) {
 b.vy = rp.vy * Math.min(1.15, Math.max(0.65, forwardSpd / 11.0));
 b.vx += rp.dirX * rp.boost;
 b.vz += rp.dirZ * rp.boost;
 b.y = groundY + 0.08;
 sfxJump();
 spawnFX(b.x, 0.35, b.z, 0xf5d89a, 10, 3.8);
 }
 }
 });
 (hole.boosts || []).forEach(bp => {
 if (Math.abs(b.x - bp.x) <= bp.w * 0.5 && Math.abs(b.z - bp.z) <= bp.d * 0.5) {
 b.vx += bp.fx * sdt; b.vz += bp.fz * sdt;
 if (s === 0 && Math.random() < 0.35) { sfxBoost(); spawnFX(b.x, 0.3, b.z, 0x67e8f9, 3, 2.5); }
 }
 });
 for (const bk of (hole.bunkers || [])) {
 const dx = (b.x - bk.x) / bk.rx, dz = (b.z - bk.z) / bk.rz;
 if (dx * dx + dz * dz <= 1.0) { inSand = true; break; }
 }
 for (const pt of (hole.portals || [])) {
 if (b.portalCD <= 0 && Math.hypot(b.x - pt.inX, b.z - pt.inZ) < 0.68) {
 const spd = Math.max(5.5, Math.hypot(b.vx, b.vz));
 b.x = pt.outX; b.z = pt.outZ;
 b.vx = Math.sin(pt.outAngle) * spd;
 b.vz = Math.cos(pt.outAngle) * spd;
 b.portalCD = 1.2;
 sfxPortal();
 spawnFX(pt.inX, 0.5, pt.inZ, 0x34d399, 14, 4.5);
 spawnFX(pt.outX, 0.5, pt.outZ, 0xfbbf24, 16, 4.8);
 }
 }
 }

 b.x += b.vx * sdt; b.z += b.vz * sdt;
 const baseFric = airborne ? 0.9985 : (inSand ? 0.935 : (state.weather === 'rainy' ? 0.991 : 0.987));
 const fric = Math.pow(baseFric, sdt * 60);
 b.vx *= fric; b.vz *= fric;

 for (const seg of state.wallSegs) collideWall2D(b, seg[0], seg[1], seg[2], seg[3], 0.84);
 for (const bmp of hole.bumpers) collideCircle2D(b, bmp.x, bmp.z, bmp.r, 1.1, 2.8);

 // Windmill house + rotating blades collision
 for (const wm of state.dynWindmills) {
 collideCircle2D(b, wm.def.x, wm.def.z, 0.85, 0.82, 0);
 // Check if any of the 4 blades is sweeping down near ground level (y < 0.65)
 const frontZ = wm.def.z + 0.78;
 if (Math.abs(b.z - frontZ) < 0.34 && b.y < 0.85) {
 for (let bi = 0; bi < 4; bi++) {
 const a = wm.angle + (bi * Math.PI) / 2;
 // Tip position in XY: tipY = 1.48 + sin(a)*len, tipX = wm.x + cos(a)*len
 const tipY = 1.48 + Math.sin(a) * wm.def.bladeLen;
 if (tipY < 0.45) {
 const bxAtGround = wm.def.x + Math.cos(a) * (1.2);
 if (Math.abs(b.x - bxAtGround) < 0.55) {
 b.vz = Math.abs(b.vz) * 0.85 + 3.2;
 b.z = frontZ + 0.36;
 sfxBounce(10, true);
 spawnFX(b.x, 0.4, b.z, 0xfef08a, 8, 3.5);
 }
 }
 }
 }
 }

 // Moving stone gates collision
 for (const mv of state.dynMovers) {
 const hw = mv.def.w / 2, hd = mv.def.d / 2;
 const xL = mv.x - hw, xR = mv.x + hw, zF = mv.z + hd, zB = mv.z - hd;
 collideWall2D(b, xL, zF, xR, zF, 0.85);
 collideWall2D(b, xR, zF, xR, zB, 0.85);
 collideWall2D(b, xR, zB, xL, zB, 0.85);
 collideWall2D(b, xL, zB, xL, zF, 0.85);
 }

 // Water hazards (ONLY trigger if NOT airborne — so you can jump OVER water!)
 if (!airborne) {
 for (const wt of (hole.waters || [])) {
 if (Math.abs(b.x - wt.x) < wt.w * 0.48 && Math.abs(b.z - wt.z) < wt.d * 0.48) {
 sfxSplash();
 spawnFX(b.x, 0.35, b.z, 0x38bdf8, 22, 5.2);
 state.strokes++; updateHUD();
 const ban = document.getElementById('banner');
 document.getElementById('bannerTitle').textContent = 'WATER HAZARD!';
 document.getElementById('bannerSub').textContent = '+1 Penalty Stroke';
 ban.classList.add('show'); state.bannerT = 1.3;
 b.x = b.lastSafeX; b.z = b.lastSafeZ; b.y = groundY; b.vx = 0; b.vy = 0; b.vz = 0;
 return;
 }
 }
 }

 if (!pointInPoly(b.x, b.z, hole.outer) && minDistToPoly(b.x, b.z, hole.outer) > 0.35) {
 b.x = b.lastSafeX; b.z = b.lastSafeZ; b.y = groundY; b.vx = 0; b.vy = 0; b.vz = 0; return;
 }

 const cDist = Math.hypot(b.x - hole.cup.x, b.z - hole.cup.z);
 if (!airborne && cDist < 0.37 && Math.hypot(b.vx, b.vz) < 13.5) {
 b.inHole = true; b.x = hole.cup.x; b.z = hole.cup.z; b.vx = 0; b.vz = 0;
 state.scores[state.holeIdx] = state.strokes; updateHUD(); sfxCup();
 spawnFX(hole.cup.x, 0.4, hole.cup.z, 0xf5d89a, 24, 6.2);
 spawnFX(hole.cup.x, 0.4, hole.cup.z, 0x34d399, 18, 5.4);
 const diff = state.strokes - hole.par;
 let title = 'PAR!';
 if (state.strokes === 1) title = 'HOLE IN ONE!!';
 else if (diff <= -2) title = 'EAGLE!';
 else if (diff === -1) title = 'BIRDIE!';
 else if (diff === 1) title = 'BOGEY';
 else if (diff >= 2) title = `+${diff}`;
 const ban = document.getElementById('banner');
 document.getElementById('bannerTitle').textContent = title;
 document.getElementById('bannerSub').textContent = `${state.strokes} Stroke${state.strokes === 1 ? '' : 's'} on Par ${hole.par}`;
 ban.classList.add('show'); state.bannerT = 2.0; state.nextHoleT = 2.1; return;
 }
 }

 const spd = Math.hypot(b.vx, b.vz);
 if (spd < 0.08) { b.vx = 0; b.vz = 0; }
 else ballMesh.rotateOnWorldAxis(new THREE.Vector3(b.vz, 0, -b.vx).normalize(), (spd * dt) / ballRadius);
 }

 // =========================================================================
 // 12. UI WIRING & MAIN 60FPS ANIMATION LOOP
 // =========================================================================
 function updateHUD() {
 document.getElementById('hudStrokes').textContent = state.strokes;
 let diff = 0, cnt = 0;
 state.scores.forEach((s, i) => { if (s !== null) { diff += s - HOLES[i].par; cnt++; } });
 document.getElementById('hudTotal').textContent = cnt === 0 || diff === 0 ? 'E' : (diff > 0 ? `+${diff}` : `${diff}`);
 }

 function showScorecard(final = false) {
 function buildNineTable(start, end, label) {
 let hRow = `<tr><th>${label}</th>`, pRow = '<tr><td><b>Par</b></td>', sRow = '<tr><td><b>You</b></td>';
 let tPar = 0, tScr = 0, any = false;
 for (let i = start; i < end; i++) {
 const h = HOLES[i]; tPar += h.par;
 hRow += `<th>${i + 1}</th>`; pRow += `<td>${h.par}</td>`;
 const s = state.scores[i];
 if (s === null) sRow += '<td>-</td>';
 else { any = true; tScr += s; sRow += `<td class="${s < h.par ? 'under' : (s === h.par ? 'even' : 'over')}">${s}</td>`; }
 }
 hRow += '<th>TOT</th></tr>'; pRow += `<td><b>${tPar}</b></td></tr>`; sRow += `<td><b>${any ? tScr : '-'}</b></td></tr>`;
 return hRow + pRow + sRow;
 }
 document.getElementById('scoreTbl').innerHTML = buildNineTable(0, 9, 'OUT') + buildNineTable(9, 18, 'IN');
 document.getElementById('modalHead').textContent = final ? '18-Hole Championship Complete!' : 'Zen Dragon Links — 18-Hole Scorecard';
 let tPar = 0, tScr = 0, played = 0;
 HOLES.forEach((h, i) => { if (state.scores[i] !== null) { tPar += h.par; tScr += state.scores[i]; played++; } });
 const d = tScr - tPar;
 document.getElementById('scoreSummary').textContent = played ? `Played ${played}/18 • Score: ${tScr} (${d === 0 ? 'Even Par' : (d > 0 ? '+' + d : d)})` : 'Play holes to record your 18-hole round';
 if (final && played === HOLES.length) {
 const prev = parseInt(localStorage.getItem('minigolf_best_zen-dragon') || '999', 10);
 if (tScr < prev) localStorage.setItem('minigolf_best_zen-dragon', String(tScr));
 }
 document.getElementById('scoreModal').classList.add('open');
 }

 document.querySelectorAll('#timeBtns .pill').forEach(b => b.addEventListener('click', () => {
 document.querySelectorAll('#timeBtns .pill').forEach(x => x.classList.remove('active'));
 b.classList.add('active'); state.time = b.dataset.t; applyAtmosphere();
 }));
 document.querySelectorAll('#skyBtns .pill').forEach(b => b.addEventListener('click', () => {
 document.querySelectorAll('#skyBtns .pill').forEach(x => x.classList.remove('active'));
 b.classList.add('active'); state.weather = b.dataset.w; applyAtmosphere();
 }));
 document.getElementById('btnCam').addEventListener('click', e => {
 state.camMode = state.camMode === 'follow' ? 'overview' : 'follow';
 e.target.textContent = state.camMode === 'follow' ? 'Course view' : 'Follow ball';
 e.target.classList.toggle('on', state.camMode === 'overview');
 });
 document.getElementById('btnGuide').addEventListener('click', e => {
 state.guideOn = !state.guideOn;
 e.target.textContent = state.guideOn ? 'Guide: ON' : 'Guide: OFF';
 e.target.classList.toggle('on', state.guideOn);
 });
 document.getElementById('btnZoomIn').addEventListener('click', () => { state.camDist = Math.max(4.8, state.camDist - 1.8); });
 document.getElementById('btnZoomOut').addEventListener('click', () => { state.camDist = Math.min(23.0, state.camDist + 1.8); });
 document.getElementById('btnRotate').addEventListener('click', () => { state.camYaw += Math.PI / 4; });

 document.getElementById('btnPrevHole').addEventListener('click', () => buildHole((state.holeIdx - 1 + HOLES.length) % HOLES.length));
 document.getElementById('btnNextHole').addEventListener('click', () => buildHole((state.holeIdx + 1) % HOLES.length));
 document.getElementById('btnReset').addEventListener('click', () => buildHole(state.holeIdx));
 document.getElementById('btnScore').addEventListener('click', () => showScorecard(false));
 document.getElementById('btnCloseModal').addEventListener('click', () => document.getElementById('scoreModal').classList.remove('open'));
 document.getElementById('btnNewRound').addEventListener('click', () => {
 state.scores = Array(HOLES.length).fill(null);
 document.getElementById('scoreModal').classList.remove('open');
 buildHole(0);
 });
 document.getElementById('btnSound').addEventListener('click', e => {
 soundOn = !soundOn; e.target.textContent = soundOn ? 'Sound: ON' : 'Sound: OFF';
 e.target.classList.toggle('on', soundOn); syncRainAudio();
 });

 window.addEventListener('resize', () => {
 camera.aspect = window.innerWidth / window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth, window.innerHeight);
 });

 let lastT = performance.now();
 function animate(now) {
 const dt = Math.min(0.05, (now - lastT) / 1000);
 lastT = now;

 stepPhysics(dt);
 updateAimAndPutter();

 waterUniforms.uTime.value = now * 0.001;
 lavaUniforms.uTime.value = now * 0.001;
 lighthouseBeacon.rotation.y += dt * 0.65;
 if (lighthouseBeamMat) lighthouseBeamMat.opacity = state.time === 'night' ? 0.24 : (state.time === 'dusk' ? 0.16 : 0.07);

 ballMesh.position.set(state.ball.x, state.ball.y, state.ball.z);
 ballGlowLight.position.set(state.ball.x, state.ball.y + 2.2, state.ball.z);
 ballShadowDisc.position.set(state.ball.x, 0.243, state.ball.z);
 const airH = Math.max(0, state.ball.y - (0.24 + ballRadius));
 ballShadowDisc.scale.setScalar(Math.max(0.45, 1.0 - airH * 0.18));
 ballShadowDisc.visible = !state.ball.inHole;

 const stopped = ballStopped();
 readyRing.visible = stopped;
 if (stopped) {
 readyRing.position.set(state.ball.x, 0.247, state.ball.z);
 readyRing.scale.setScalar(1 + Math.sin(now * 0.0055) * 0.12);
 }

 if (state.flagMesh) {
 const fp = state.flagMesh.geometry.attributes.position;
 for (let i = 0; i < fp.count; i++) {
 const fx = fp.getX(i);
 fp.setZ(i, Math.sin(now * 0.007 - fx * 4.5) * 0.06 * (fx + 0.5));
 }
 fp.needsUpdate = true;
 }

 chevronTex.offset.y -= dt * 0.65;
 if (shrineLight.visible) shrineLight.intensity = 2.8 + Math.sin(now * 0.008) * 0.6;

 const baseLantern = ATMOS[state.time].lanternInt;
 if (baseLantern > 0.05) {
 for (let i = 0; i < lanternHalos.length; i++) {
 const flk = 1.0 + Math.sin(now * 0.011 + i * 2.3) * 0.08;
 lanternLights[i].intensity = baseLantern * flk;
 lanternHalos[i].scale.setScalar(2.1 * flk);
 }
 }

 koiFish.forEach((k, idx) => {
 k.ang += k.spd * dt;
 k.mesh.position.set(Math.cos(k.ang) * k.rad, 0, Math.sin(k.ang) * k.rad);
 k.mesh.rotation.y = -k.ang + Math.sin(now * 0.008 + idx) * 0.12;
 });

 const pArr = petalGeo.attributes.position.array;
 for (let i = 0; i < petalCount; i++) {
 pArr[i * 3] += Math.sin(now * 0.0012 + i) * 0.45 * dt;
 pArr[i * 3 + 1] -= 0.58 * dt;
 if (pArr[i * 3 + 1] < 0.2) pArr[i * 3 + 1] = 11.2;
 }
 petalGeo.attributes.position.needsUpdate = true;

 if (ffMat.opacity > 0.05) {
 const fArr = ffGeo.attributes.position.array;
 for (let i = 0; i < fireflyCount; i++) {
 fArr[i * 3] += Math.sin(now * 0.0015 + i * 2.1) * 0.35 * dt;
 fArr[i * 3 + 1] += Math.cos(now * 0.002 + i) * 0.22 * dt;
 }
 ffGeo.attributes.position.needsUpdate = true;
 }

 if (state.weather === 'rainy') {
 const pos = rainGeo.attributes.position.array;
 for (let i = 0; i < rainCount; i++) {
 pos[i * 6 + 1] -= 26 * dt; pos[i * 6 + 4] -= 26 * dt;
 if (pos[i * 6 + 1] < 0) { const ny = 24 + Math.random() * 6; pos[i * 6 + 1] = ny; pos[i * 6 + 4] = ny - 0.9; }
 }
 rainGeo.attributes.position.needsUpdate = true;
 }

 if (state.camMode === 'overview') {
 camera.position.lerp(new THREE.Vector3(0, 22, 24), 0.08);
 camera.lookAt(0, 1.5, -4);
 } else {
 const cx = state.ball.x + Math.sin(state.camYaw) * Math.cos(state.camPitch) * state.camDist;
 const cy = state.ball.y + Math.sin(state.camPitch) * state.camDist;
 const cz = state.ball.z + Math.cos(state.camYaw) * Math.cos(state.camPitch) * state.camDist;
 camera.position.lerp(new THREE.Vector3(cx, cy, cz), 0.12);
 camera.lookAt(state.ball.x, state.ball.y + 0.45, state.ball.z);
 }

 sunLight.target.position.set(state.ball.x, 0, state.ball.z);
 sunLight.target.updateMatrixWorld();
 renderer.render(scene, camera);
 requestAnimationFrame(animate);
 }

 const holeSel = document.getElementById('holeSelect');
 HOLES.forEach((h, i) => {
 const opt = document.createElement('option');
 opt.value = String(i);
 opt.textContent = `${i + 1}. ${h.name}`;
 holeSel.appendChild(opt);
 });
 holeSel.addEventListener('change', () => buildHole(parseInt(holeSel.value, 10)));

 buildHole(0);
 setTimeout(() => {
 const ld = document.getElementById('loader');
 if (ld) {
 ld.style.opacity = '0';
 setTimeout(() => ld.remove(), 420);
 }
 }, 250);
 requestAnimationFrame(animate);
})();
</script>
